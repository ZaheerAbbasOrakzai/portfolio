<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_AgentMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    
    <radialGradient id="aura_AgentMesh" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#00F2FF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGrad_AgentMesh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00F2FF" />
    </linearGradient>

    <pattern id="dotGrid_AgentMesh" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <filter id="glow_AgentMesh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad_AgentMesh)" />
  <rect width="800" height="450" fill="url(#dotGrid_AgentMesh)" />
  <rect width="800" height="450" fill="url(#aura_AgentMesh)" />

  <!-- Outer HUD Frame Border -->
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="url(#accentGrad_AgentMesh)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner HUD Accents -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#8B5CF6" stroke-width="2.5" />
  <path d="M 764 12 L 788 12 L 788 36" fill="none" stroke="#8B5CF6" stroke-width="2.5" />
  <path d="M 12 414 L 12 438 L 36 438" fill="none" stroke="#8B5CF6" stroke-width="2.5" />
  <path d="M 764 438 L 788 438 L 788 414" fill="none" stroke="#8B5CF6" stroke-width="2.5" />

  <!-- Top Telemetry Header -->
  <g transform="translate(32, 38)">
    <circle cx="4" cy="4" r="3.5" fill="#8B5CF6" filter="url(#glow_AgentMesh)" />
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8B5CF6" letter-spacing="1.5">SYS // AGENTMESH</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(50, 20)">
        <circle cx="100" cy="95" r="45" fill="#0E1626" stroke="#8B5CF6" stroke-width="2" />
        <text x="100" y="90" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#8B5CF6">PLANNER</text>
        <text x="100" y="105" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Goal Decompose</text>

        <circle cx="340" cy="40" r="38" fill="#0E1626" stroke="#00F2FF" stroke-width="1.5" />
        <text x="340" y="38" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#00F2FF">CODER</text>
        <text x="340" y="52" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Tool Exec</text>

        <circle cx="340" cy="150" r="38" fill="#0E1626" stroke="#F59E0B" stroke-width="1.5" />
        <text x="340" y="148" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#F59E0B">CRITIC</text>
        <text x="340" y="162" text-anchor="middle" font-family="monospace" font-size="7" fill="#94A3B8">Reflection</text>

        <circle cx="580" cy="95" r="45" fill="#0E1626" stroke="#10B981" stroke-width="2" />
        <text x="580" y="90" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#10B981">CONSENSUS</text>
        <text x="580" y="105" text-anchor="middle" font-family="monospace" font-size="8" fill="#CBD5E1">Gatekeeper</text>

        <line x1="145" y1="80" x2="305" y2="45" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="3,3" />
        <line x1="145" y1="110" x2="305" y2="145" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="3,3" />
        <line x1="375" y1="45" x2="535" y2="80" stroke="#00F2FF" stroke-width="2" stroke-dasharray="3,3" />
        <line x1="375" y1="145" x2="535" y2="110" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,3" />
      </g>
    
  </g>

  <!-- Bottom Identity Bar -->
  <g transform="translate(32, 405)">
    <line x1="0" y1="-12" x2="736" y2="-12" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">AgentMesh Runtime</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Actor-Model Orchestration • Distributed Verification</text>
  </g>
</svg>