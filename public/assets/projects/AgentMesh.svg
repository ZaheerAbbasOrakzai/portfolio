<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="am_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#021A0D"/>
      <stop offset="100%" stop-color="#050D0A"/>
    </linearGradient>
    <filter id="am_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes am_pulse { 0%,100%{r:12;opacity:0.7} 50%{r:16;opacity:1} }
      @keyframes am_dash { 0%{stroke-dashoffset:20} 100%{stroke-dashoffset:0} }
      @keyframes am_orbit { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
      .am_agent { animation: am_pulse 3s ease-in-out infinite; }
      .am_link { stroke-dasharray:6 4; animation: am_dash 2s linear infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#am_bg)"/>
  
  <!-- Agent Mesh Network -->
  <line class="am_link" x1="400" y1="120" x2="200" y2="80" stroke="#10B981" stroke-width="1.5" opacity="0.5" style="animation-delay:0s"/>
  <line class="am_link" x1="400" y1="120" x2="600" y2="80" stroke="#10B981" stroke-width="1.5" opacity="0.5" style="animation-delay:0.15s"/>
  <line class="am_link" x1="400" y1="120" x2="150" y2="200" stroke="#10B981" stroke-width="1.5" opacity="0.5" style="animation-delay:0.3s"/>
  <line class="am_link" x1="400" y1="120" x2="650" y2="200" stroke="#10B981" stroke-width="1.5" opacity="0.5" style="animation-delay:0.44999999999999996s"/>
  <line class="am_link" x1="200" y1="80" x2="150" y2="200" stroke="#34D399" stroke-width="1.5" opacity="0.5" style="animation-delay:0.6s"/>
  <line class="am_link" x1="600" y1="80" x2="650" y2="200" stroke="#6EE7B7" stroke-width="1.5" opacity="0.5" style="animation-delay:0.75s"/>
  <line class="am_link" x1="150" y1="200" x2="250" y2="300" stroke="#059669" stroke-width="1.5" opacity="0.5" style="animation-delay:0.8999999999999999s"/>
  <line class="am_link" x1="650" y1="200" x2="550" y2="300" stroke="#047857" stroke-width="1.5" opacity="0.5" style="animation-delay:1.05s"/>
  <line class="am_link" x1="250" y1="300" x2="550" y2="300" stroke="#34D399" stroke-width="1.5" opacity="0.5" style="animation-delay:1.2s"/>
  <line class="am_link" x1="200" y1="80" x2="600" y2="80" stroke="#34D399" stroke-width="1.5" opacity="0.5" style="animation-delay:1.3499999999999999s"/>
  <line class="am_link" x1="250" y1="300" x2="400" y2="120" stroke="#34D399" stroke-width="1.5" opacity="0.5" style="animation-delay:1.5s"/>
  <line class="am_link" x1="550" y1="300" x2="400" y2="120" stroke="#6EE7B7" stroke-width="1.5" opacity="0.5" style="animation-delay:1.65s"/>
    <g>
      <circle class="am_agent" cx="400" cy="120" r="18" fill="#10B981" opacity="0.2" filter="url(#am_g)" style="animation-delay:0s"/>
      <circle cx="400" cy="120" r="14" fill="#021A0D" stroke="#10B981" stroke-width="2"/>
      <text x="400" y="153" text-anchor="middle" font-family="monospace" font-size="9" fill="#10B981" font-weight="700">ORCHESTRATOR</text>
    </g>
  
    <g>
      <circle class="am_agent" cx="200" cy="80" r="14" fill="#34D399" opacity="0.2" filter="url(#am_g)" style="animation-delay:0.4s"/>
      <circle cx="200" cy="80" r="10" fill="#021A0D" stroke="#34D399" stroke-width="2"/>
      <text x="200" y="109" text-anchor="middle" font-family="monospace" font-size="9" fill="#34D399" font-weight="700">PLANNER</text>
    </g>
  
    <g>
      <circle class="am_agent" cx="600" cy="80" r="14" fill="#6EE7B7" opacity="0.2" filter="url(#am_g)" style="animation-delay:0.8s"/>
      <circle cx="600" cy="80" r="10" fill="#021A0D" stroke="#6EE7B7" stroke-width="2"/>
      <text x="600" y="109" text-anchor="middle" font-family="monospace" font-size="9" fill="#6EE7B7" font-weight="700">CRITIC</text>
    </g>
  
    <g>
      <circle class="am_agent" cx="150" cy="200" r="14" fill="#059669" opacity="0.2" filter="url(#am_g)" style="animation-delay:1.2000000000000002s"/>
      <circle cx="150" cy="200" r="10" fill="#021A0D" stroke="#059669" stroke-width="2"/>
      <text x="150" y="229" text-anchor="middle" font-family="monospace" font-size="9" fill="#059669" font-weight="700">CODER</text>
    </g>
  
    <g>
      <circle class="am_agent" cx="650" cy="200" r="14" fill="#047857" opacity="0.2" filter="url(#am_g)" style="animation-delay:1.6s"/>
      <circle cx="650" cy="200" r="10" fill="#021A0D" stroke="#047857" stroke-width="2"/>
      <text x="650" y="229" text-anchor="middle" font-family="monospace" font-size="9" fill="#047857" font-weight="700">RESEARCHER</text>
    </g>
  
    <g>
      <circle class="am_agent" cx="250" cy="300" r="14" fill="#34D399" opacity="0.2" filter="url(#am_g)" style="animation-delay:2s"/>
      <circle cx="250" cy="300" r="10" fill="#021A0D" stroke="#34D399" stroke-width="2"/>
      <text x="250" y="329" text-anchor="middle" font-family="monospace" font-size="9" fill="#34D399" font-weight="700">EXECUTOR</text>
    </g>
  
    <g>
      <circle class="am_agent" cx="550" cy="300" r="14" fill="#6EE7B7" opacity="0.2" filter="url(#am_g)" style="animation-delay:2.4000000000000004s"/>
      <circle cx="550" cy="300" r="10" fill="#021A0D" stroke="#6EE7B7" stroke-width="2"/>
      <text x="550" y="329" text-anchor="middle" font-family="monospace" font-size="9" fill="#6EE7B7" font-weight="700">VALIDATOR</text>
    </g>
  
  <!-- Consensus Panel -->
  <g transform="translate(30,360)">
    <rect x="0" y="0" width="740" height="50" rx="6" fill="#021A0D" stroke="#059669" stroke-width="1"/>
    <text x="20" y="20" font-family="monospace" font-size="10" fill="#34D399">CONSENSUS: 6/7 agents agreed on plan decomposition</text>
    <text x="20" y="38" font-family="monospace" font-size="9" fill="#64748B">Task Delegation: Round-Robin • Voting: Weighted Majority • Execution: Parallel DAG</text>
  </g>
  
  <g transform="translate(30,430)">
    <text x="0" y="0" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">AgentMesh</text>
    <text x="740" y="0" text-anchor="end" font-family="monospace" font-size="11" fill="#10B981">Multi-Agent Coordination • Consensus Voting • DAG Execution</text>
  </g>
</svg>