    <polyline class="martesumeptimizerv10svg_line" points="20,105 60,117 100,77 140,110 180,87 220,103 260,119 300,67 340,82 380,98 420,124 460,64 500,117 540,105 580,95 620,92 660,112 700,63" fill="none" stroke="#C084FC" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#7E22CE" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#7E22CE" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#7E22CE" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#7E22CE" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#7E22CE" stroke-width="0.5" opacity="0.3"/>
