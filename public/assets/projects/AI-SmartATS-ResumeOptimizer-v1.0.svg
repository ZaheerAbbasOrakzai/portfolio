      <stop offset="0%" stop-color="#0D0A1A"/>
      <stop offset="100%" stop-color="#080510"/>
    </linearGradient>
    <filter id="martesumeptimizerv10svg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
