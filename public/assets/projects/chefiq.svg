<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="chefiqsvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0D05"/>
      <stop offset="100%" stop-color="#0D0805"/>
    </linearGradient>
    <filter id="chefiqsvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes chefiqsvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes chefiqsvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes chefiqsvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .chefiqsvg_line { stroke-dasharray:800; animation: chefiqsvg_draw 4s ease-out forwards; }
      .chefiqsvg_dot { animation: chefiqsvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#chefiqsvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#DC2626" filter="url(#chefiqsvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#DC2626" font-weight="700" letter-spacing="2">CULINARY INTELLIGENCE</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#991B1B" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#2D0A0A" stroke="#991B1B" stroke-width="1"/>
    <polyline class="chefiqsvg_line" points="20,99 60,105 100,71 140,90 180,71 220,85 260,103 300,108 340,71 380,102 420,73 460,101 500,111 540,96 580,78 620,78 660,80 700,80" fill="none" stroke="#DC2626" stroke-width="2.5" filter="url(#chefiqsvg_g)"/>
    <polyline class="chefiqsvg_line" points="20,67 60,67 100,55 140,108 180,55 220,127 260,129 300,114 340,93 380,85 420,132 460,66 500,57 540,101 580,110 620,128 660,71 700,121" fill="none" stroke="#F87171" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#991B1B" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#991B1B" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#991B1B" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#991B1B" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#991B1B" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#F87171" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#2D0A0A" stroke="#DC2626" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#F87171">Michelin Persona</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#2D0A0A" stroke="#DC2626" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#F87171">Macronutrient Balance</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#2D0A0A" stroke="#DC2626" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#F87171">Substitutions</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#FECACA" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#2D0A0A" stroke="#991B1B" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="chefiqsvg_dot" x="120" y="27" width="356" height="14" rx="3" fill="#DC2626" opacity="0.5" style="animation-delay:0s"/>
      <text x="486" y="38" font-family="monospace" font-size="11" fill="#DC2626" font-weight="700">87%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="chefiqsvg_dot" x="120" y="55" width="192" height="14" rx="3" fill="#DC2626" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="322" y="66" font-family="monospace" font-size="11" fill="#DC2626" font-weight="700">33ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="chefiqsvg_dot" x="120" y="83" width="390" height="14" rx="3" fill="#DC2626" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="520" y="94" font-family="monospace" font-size="11" fill="#DC2626" font-weight="700">357/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#991B1B" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">ChefIQ</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#DC2626">Michelin Persona • Macronutrient Balance • Substitutions</text>
  </g>
</svg>