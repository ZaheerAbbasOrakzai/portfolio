<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_ml-from-scratch-plus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    
    <radialGradient id="aura_ml-from-scratch-plus" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGrad_ml-from-scratch-plus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <pattern id="dotGrid_ml-from-scratch-plus" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <filter id="glow_ml-from-scratch-plus" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad_ml-from-scratch-plus)" />
  <rect width="800" height="450" fill="url(#dotGrid_ml-from-scratch-plus)" />
  <rect width="800" height="450" fill="url(#aura_ml-from-scratch-plus)" />

  <!-- Outer HUD Frame Border -->
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="url(#accentGrad_ml-from-scratch-plus)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner HUD Accents -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#10B981" stroke-width="2.5" />
  <path d="M 764 12 L 788 12 L 788 36" fill="none" stroke="#10B981" stroke-width="2.5" />
  <path d="M 12 414 L 12 438 L 36 438" fill="none" stroke="#10B981" stroke-width="2.5" />
  <path d="M 764 438 L 788 438 L 788 414" fill="none" stroke="#10B981" stroke-width="2.5" />

  <!-- Top Telemetry Header -->
  <g transform="translate(32, 38)">
    <circle cx="4" cy="4" r="3.5" fill="#10B981" filter="url(#glow_ml-from-scratch-plus)" />
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10B981" letter-spacing="1.5">SYS // ML-FROM-SCRATCH-PLUS</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(40, 20)">
        <rect x="0" y="0" width="340" height="190" rx="8" fill="#0B132B" stroke="#10B981" stroke-width="1.5" />
        <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#10B981">PURE NUMPY VECTOR CALCULUS</text>
        <text x="20" y="60" font-family="monospace" font-size="9" fill="#CBD5E1">• Backpropagation Computational Graph</text>
        <text x="20" y="85" font-family="monospace" font-size="9" fill="#CBD5E1">• Support Vector Machines (Lagrange Multipliers)</text>
        <text x="20" y="110" font-family="monospace" font-size="9" fill="#CBD5E1">• Gradient Boosted Trees (Residual Fitting)</text>
        <text x="20" y="135" font-family="monospace" font-size="9" fill="#CBD5E1">• PCA via SVD Decomposition</text>
        <text x="20" y="165" font-family="monospace" font-size="9" fill="#10B981">0 External ML Libraries Required</text>

        <g transform="translate(370, 0)">
          <rect x="0" y="0" width="350" height="190" rx="8" fill="#0E1626" stroke="#8B5CF6" stroke-width="1.5" />
          <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#8B5CF6">SCIKIT-LEARN PARITY: 99.9%</text>
          <text x="20" y="60" font-family="monospace" font-size="9" fill="#CBD5E1">Classification &amp; Regression Equivalence</text>
          <text x="20" y="85" font-family="monospace" font-size="9" fill="#CBD5E1">Step-by-Step Mathematical Derivations</text>
          <text x="20" y="110" font-family="monospace" font-size="9" fill="#CBD5E1">Adam, RMSprop, SGD Optimizers</text>
          <text x="20" y="135" font-family="monospace" font-size="9" fill="#00F2FF">15+ Fundamental Models Implemented</text>
        </g>
      </g>
    
  </g>

  <!-- Bottom Identity Bar -->
  <g transform="translate(32, 405)">
    <line x1="0" y1="-12" x2="736" y2="-12" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">ML From Scratch Plus</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Pure NumPy Implementations • 0 External Dependencies</text>
  </g>
</svg>