<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="nexusaisuitesvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0D1A"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <filter id="nexusaisuitesvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes nexusaisuitesvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes nexusaisuitesvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes nexusaisuitesvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .nexusaisuitesvg_line { stroke-dasharray:800; animation: nexusaisuitesvg_draw 4s ease-out forwards; }
      .nexusaisuitesvg_dot { animation: nexusaisuitesvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#nexusaisuitesvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#2563EB" filter="url(#nexusaisuitesvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#2563EB" font-weight="700" letter-spacing="2">AI TOOLING SUITE</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#1D4ED8" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#0A1530" stroke="#1D4ED8" stroke-width="1"/>
    <polyline class="nexusaisuitesvg_line" points="20,88 60,88 100,94 140,120 180,96 220,109 260,109 300,127 340,79 380,65 420,128 460,120 500,111 540,110 580,82 620,77 660,77 700,105" fill="none" stroke="#2563EB" stroke-width="2.5" filter="url(#nexusaisuitesvg_g)"/>
    <polyline class="nexusaisuitesvg_line" points="20,125 60,83 100,115 140,90 180,106 220,134 260,84 300,95 340,102 380,83 420,129 460,61 500,115 540,105 580,88 620,125 660,128 700,60" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#1D4ED8" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#1D4ED8" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#1D4ED8" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#1D4ED8" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#1D4ED8" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#3B82F6" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#0A1530" stroke="#2563EB" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#3B82F6">Unified Workflows</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#0A1530" stroke="#2563EB" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#3B82F6">Prompt Management</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#0A1530" stroke="#2563EB" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#3B82F6">Telemetry</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#93C5FD" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#0A1530" stroke="#1D4ED8" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="nexusaisuitesvg_dot" x="120" y="27" width="187" height="14" rx="3" fill="#2563EB" opacity="0.5" style="animation-delay:0s"/>
      <text x="317" y="38" font-family="monospace" font-size="11" fill="#2563EB" font-weight="700">96%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="nexusaisuitesvg_dot" x="120" y="55" width="346" height="14" rx="3" fill="#2563EB" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="476" y="66" font-family="monospace" font-size="11" fill="#2563EB" font-weight="700">31ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="nexusaisuitesvg_dot" x="120" y="83" width="256" height="14" rx="3" fill="#2563EB" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="386" y="94" font-family="monospace" font-size="11" fill="#2563EB" font-weight="700">227/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#1D4ED8" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Nexus AI Suite</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#2563EB">Unified Workflows • Prompt Management • Telemetry</text>
  </g>
</svg>