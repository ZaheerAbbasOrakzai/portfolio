<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_socraticai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    
    <radialGradient id="aura_socraticai" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#00F2FF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGrad_socraticai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#00F2FF" />
    </linearGradient>

    <pattern id="dotGrid_socraticai" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <filter id="glow_socraticai" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad_socraticai)" />
  <rect width="800" height="450" fill="url(#dotGrid_socraticai)" />
  <rect width="800" height="450" fill="url(#aura_socraticai)" />

  <!-- Outer HUD Frame Border -->
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="url(#accentGrad_socraticai)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner HUD Accents -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <path d="M 764 12 L 788 12 L 788 36" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <path d="M 12 414 L 12 438 L 36 438" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <path d="M 764 438 L 788 438 L 788 414" fill="none" stroke="#F59E0B" stroke-width="2.5" />

  <!-- Top Telemetry Header -->
  <g transform="translate(32, 38)">
    <circle cx="4" cy="4" r="3.5" fill="#F59E0B" filter="url(#glow_socraticai)" />
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="1.5">SYS // SOCRATICAI</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(50, 20)">
        <rect x="0" y="0" width="320" height="190" rx="8" fill="#0B132B" stroke="#F59E0B" stroke-width="1.5" />
        <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#F59E0B">BLOOM TAXONOMY SCAFFOLD</text>
        <line x1="20" y1="50" x2="300" y2="50" stroke="#334155" />
        <text x="20" y="75" font-family="monospace" font-size="9" fill="#64748B">Level 1: Recall & Verification</text>
        <text x="20" y="100" font-family="monospace" font-size="9" fill="#CBD5E1">Level 2: Concept Diagnosis</text>
        <text x="20" y="125" font-family="monospace" font-size="9" fill="#F59E0B">Level 3: Guided Inquiry Hint</text>
        <text x="20" y="150" font-family="monospace" font-size="9" fill="#00F2FF">Level 4: Synthesis & Reflection</text>

        <g transform="translate(360, 0)">
          <rect x="0" y="0" width="340" height="190" rx="8" fill="#0E1626" stroke="#00F2FF" stroke-width="1.5" />
          <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#00F2FF">STUDENT MASTERY MATRIX</text>
          <circle cx="90" cy="110" r="50" fill="none" stroke="#1E293B" stroke-width="8" />
          <path d="M 90 60 A 50 50 0 1 1 50 140" fill="none" stroke="#00F2FF" stroke-width="8" stroke-linecap="round" />
          <text x="90" y="112" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#F8FAFC">91%</text>
          <text x="90" y="127" text-anchor="middle" font-family="monospace" font-size="7" fill="#00F2FF">DIAGNOSTIC</text>

          <g transform="translate(180, 60)">
            <text x="0" y="20" font-family="monospace" font-size="9" fill="#10B981">✓ KaTeX Math Render</text>
            <text x="0" y="45" font-family="monospace" font-size="9" fill="#10B981">✓ No Outright Leaks</text>
            <text x="0" y="70" font-family="monospace" font-size="9" fill="#F59E0B">3.2x Engagement</text>
          </g>
        </g>
      </g>
    
  </g>

  <!-- Bottom Identity Bar -->
  <g transform="translate(32, 405)">
    <line x1="0" y1="-12" x2="736" y2="-12" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">SocraticAI</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Cognitive Scaffolding • Misconception Diagnostics</text>
  </g>
</svg>