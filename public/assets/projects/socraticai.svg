<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="socraticaisvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1A0D"/>
      <stop offset="100%" stop-color="#051A08"/>
    </linearGradient>
    <filter id="socraticaisvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes socraticaisvg_pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
      @keyframes socraticaisvg_flow { 0%{stroke-dashoffset:30} 100%{stroke-dashoffset:0} }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#socraticaisvg_bg)"/>
  
      <g transform="translate(30,65)">
        <text x="0" y="-10" font-family="monospace" font-size="11" fill="#4ADE80" font-weight="700">SOCRATIC DIALOGUE TREE</text>
        <rect x="0" y="0" width="740" height="240" rx="8" fill="#0D2D15" stroke="#166534" stroke-width="1"/>
        <!-- Question tree -->
        <g>
          <rect x="280" y="15" width="180" height="35" rx="6" fill="#052E16" stroke="#22C55E" stroke-width="1.5"/>
          <text x="370" y="37" text-anchor="middle" font-family="monospace" font-size="10" fill="#4ADE80">"What is backprop?"</text>
          <line x1="330" y1="50" x2="180" y2="85" stroke="#22C55E" stroke-width="1"/>
          <line x1="410" y1="50" x2="560" y2="85" stroke="#22C55E" stroke-width="1"/>
          
          <rect x="80" y="85" width="200" height="32" rx="6" fill="#052E16" stroke="#4ADE80" stroke-width="1"/>
          <text x="180" y="105" text-anchor="middle" font-family="monospace" font-size="9" fill="#86EFAC">"Can you explain chain rule?"</text>
          <rect x="460" y="85" width="200" height="32" rx="6" fill="#052E16" stroke="#4ADE80" stroke-width="1"/>
          <text x="560" y="105" text-anchor="middle" font-family="monospace" font-size="9" fill="#86EFAC">"What are gradients?"</text>
          
          <line x1="180" y1="117" x2="120" y2="150" stroke="#166534" stroke-width="1"/>
          <line x1="180" y1="117" x2="240" y2="150" stroke="#166534" stroke-width="1"/>
          
          <rect x="40" y="150" width="160" height="28" rx="5" fill="#0D2D15" stroke="#166534" stroke-width="1"/>
          <text x="120" y="168" text-anchor="middle" font-family="monospace" font-size="8" fill="#94A3B8">Student: "f(g(x))' = f'·g'"</text>
          <rect x="210" y="150" width="100" height="28" rx="5" fill="#052E16" stroke="#22C55E" stroke-width="1"/>
          <text x="260" y="168" text-anchor="middle" font-family="monospace" font-size="9" fill="#22C55E">✓ Correct!</text>
        </g>
        <!-- Diagnostic panel -->
        <g transform="translate(460,135)">
          <rect x="0" y="0" width="260" height="90" rx="6" fill="#052E16" stroke="#166534" stroke-width="1"/>
          <text x="10" y="18" font-family="monospace" font-size="10" fill="#4ADE80" font-weight="700">LEARNER DIAGNOSTIC</text>
          <text x="10" y="38" font-family="monospace" font-size="9" fill="#94A3B8">Understanding: ████████░░ 82%</text>
          <text x="10" y="55" font-family="monospace" font-size="9" fill="#94A3B8">Misconceptions: 1 identified</text>
          <text x="10" y="72" font-family="monospace" font-size="9" fill="#94A3B8">Next probe: Matrix calculus</text>
          <text x="10" y="85" font-family="monospace" font-size="9" fill="#22C55E">Bloom Level: Apply → Analyze</text>
        </g>
      </g>
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#166534" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">SocraticAI</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#22C55E">Structured Inquiry • Diagnostic Feedback • Pedagogy</text>
  </g>
</svg>