<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="queryforgesvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05100D"/>
      <stop offset="100%" stop-color="#0A1A15"/>
    </linearGradient>
    <filter id="queryforgesvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes queryforgesvg_pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
      @keyframes queryforgesvg_flow { 0%{stroke-dashoffset:30} 100%{stroke-dashoffset:0} }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#queryforgesvg_bg)"/>
  
      <g transform="translate(30,65)">
        <text x="0" y="-10" font-family="monospace" font-size="11" fill="#2DD4BF" font-weight="700">NATURAL LANGUAGE → SQL PIPELINE</text>
        <rect x="0" y="0" width="740" height="100" rx="8" fill="#0A2D25" stroke="#115E59" stroke-width="1"/>
        <rect x="15" y="12" width="220" height="35" rx="5" fill="#052E24" stroke="#14B8A6" stroke-width="1"/>
        <text x="25" y="33" font-family="monospace" font-size="10" fill="#2DD4BF">"Show top 5 customers by</text>
        <text x="25" y="43" font-family="monospace" font-size="10" fill="#2DD4BF"> revenue this quarter"</text>
        <text x="255" y="33" font-family="monospace" font-size="16" fill="#14B8A6">→</text>
        <rect x="285" y="12" width="440" height="76" rx="5" fill="#052E24" stroke="#115E59" stroke-width="1"/>
        <text x="295" y="30" font-family="monospace" font-size="9" fill="#99F6E4">SELECT c.name, SUM(o.amount) AS revenue</text>
        <text x="295" y="44" font-family="monospace" font-size="9" fill="#99F6E4">FROM customers c JOIN orders o ON c.id=o.cust_id</text>
        <text x="295" y="58" font-family="monospace" font-size="9" fill="#99F6E4">WHERE o.date >= DATE_TRUNC('quarter', NOW())</text>
        <text x="295" y="72" font-family="monospace" font-size="9" fill="#99F6E4">GROUP BY c.name ORDER BY revenue DESC LIMIT 5;</text>
      </g>
      <g transform="translate(30,185)">
        <text x="0" y="-10" font-family="monospace" font-size="11" fill="#99F6E4" font-weight="700">SCHEMA INTROSPECTION</text>
        <rect x="0" y="0" width="350" height="130" rx="8" fill="#0A2D25" stroke="#115E59" stroke-width="1"/>
        
          <g transform="translate(15,20)">
            <rect width="320" height="22" rx="3" fill="#052E24" stroke="#115E59" stroke-width="0.5"/>
            <text x="10" y="15" font-family="monospace" font-size="9" fill="#2DD4BF">📋 customers (id, name, email, tier)</text>
          </g>
        
          <g transform="translate(15,47)">
            <rect width="320" height="22" rx="3" fill="#052E24" stroke="#115E59" stroke-width="0.5"/>
            <text x="10" y="15" font-family="monospace" font-size="9" fill="#2DD4BF">📋 orders (id, cust_id, amount, date)</text>
          </g>
        
          <g transform="translate(15,74)">
            <rect width="320" height="22" rx="3" fill="#052E24" stroke="#115E59" stroke-width="0.5"/>
            <text x="10" y="15" font-family="monospace" font-size="9" fill="#2DD4BF">📋 products (id, sku, price, category)</text>
          </g>
        
          <g transform="translate(15,101)">
            <rect width="320" height="22" rx="3" fill="#052E24" stroke="#115E59" stroke-width="0.5"/>
            <text x="10" y="15" font-family="monospace" font-size="9" fill="#2DD4BF">📋 inventory (prod_id, qty, warehouse)</text>
          </g>
        
      </g>
      <g transform="translate(410,185)">
        <text x="0" y="-10" font-family="monospace" font-size="11" fill="#99F6E4" font-weight="700">INDEX ADVISOR</text>
        <rect x="0" y="0" width="360" height="130" rx="8" fill="#0A2D25" stroke="#115E59" stroke-width="1"/>
        <text x="15" y="25" font-family="monospace" font-size="9" fill="#14B8A6">✓ Recommended: CREATE INDEX idx_orders_date</text>
        <text x="15" y="45" font-family="monospace" font-size="9" fill="#14B8A6">  ON orders(date, cust_id)</text>
        <text x="15" y="70" font-family="monospace" font-size="9" fill="#F59E0B">⚠ Query Plan: Seq Scan → Index Scan</text>
        <text x="15" y="90" font-family="monospace" font-size="9" fill="#F59E0B">  Est. speedup: 340ms → 12ms (28x)</text>
        <text x="15" y="115" font-family="monospace" font-size="9" fill="#10B981">✓ Self-correction: Fixed JOIN ambiguity</text>
      </g>
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#115E59" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">QueryForge</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#14B8A6">Text-to-SQL • Schema Introspection • Index Advisor</text>
  </g>
</svg>