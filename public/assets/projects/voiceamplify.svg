<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="voiceamplifysvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0A1A"/>
      <stop offset="100%" stop-color="#100510"/>
    </linearGradient>
    <filter id="voiceamplifysvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes voiceamplifysvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes voiceamplifysvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes voiceamplifysvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .voiceamplifysvg_line { stroke-dasharray:800; animation: voiceamplifysvg_draw 4s ease-out forwards; }
      .voiceamplifysvg_dot { animation: voiceamplifysvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#voiceamplifysvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#D946EF" filter="url(#voiceamplifysvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#D946EF" font-weight="700" letter-spacing="2">NEURAL AUDIO ENGINE</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#86198F" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#2D0A2D" stroke="#86198F" stroke-width="1"/>
    <polyline class="voiceamplifysvg_line" points="20,83 60,69 100,89 140,54 180,69 220,114 260,105 300,106 340,128 380,59 420,68 460,85 500,60 540,100 580,120 620,74 660,95 700,54" fill="none" stroke="#D946EF" stroke-width="2.5" filter="url(#voiceamplifysvg_g)"/>
    <polyline class="voiceamplifysvg_line" points="20,85 60,118 100,126 140,133 180,95 220,80 260,105 300,129 340,95 380,128 420,75 460,68 500,86 540,68 580,85 620,115 660,69 700,87" fill="none" stroke="#E879F9" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#86198F" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#86198F" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#86198F" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#86198F" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#86198F" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#E879F9" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#2D0A2D" stroke="#D946EF" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#E879F9">Speech Enhancement</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#2D0A2D" stroke="#D946EF" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#E879F9">Noise Removal</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#2D0A2D" stroke="#D946EF" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#E879F9">Loudness Balancing</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#F0ABFC" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#2D0A2D" stroke="#86198F" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="voiceamplifysvg_dot" x="120" y="27" width="274" height="14" rx="3" fill="#D946EF" opacity="0.5" style="animation-delay:0s"/>
      <text x="404" y="38" font-family="monospace" font-size="11" fill="#D946EF" font-weight="700">92%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="voiceamplifysvg_dot" x="120" y="55" width="350" height="14" rx="3" fill="#D946EF" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="480" y="66" font-family="monospace" font-size="11" fill="#D946EF" font-weight="700">38ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="voiceamplifysvg_dot" x="120" y="83" width="415" height="14" rx="3" fill="#D946EF" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="545" y="94" font-family="monospace" font-size="11" fill="#D946EF" font-weight="700">634/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#86198F" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">VoiceAmplify</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#D946EF">Speech Enhancement • Noise Removal • Loudness Balancing</text>
  </g>
</svg>