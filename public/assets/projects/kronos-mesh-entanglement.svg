<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="kronosmeshentanglementsvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1A0A"/>
      <stop offset="100%" stop-color="#050D05"/>
    </linearGradient>
    <filter id="kronosmeshentanglementsvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes kronosmeshentanglementsvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes kronosmeshentanglementsvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes kronosmeshentanglementsvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .kronosmeshentanglementsvg_line { stroke-dasharray:800; animation: kronosmeshentanglementsvg_draw 4s ease-out forwards; }
      .kronosmeshentanglementsvg_dot { animation: kronosmeshentanglementsvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#kronosmeshentanglementsvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#059669" filter="url(#kronosmeshentanglementsvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#059669" font-weight="700" letter-spacing="2">NETWORK TOPOLOGY</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#047857" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#0A2D15" stroke="#047857" stroke-width="1"/>
    <polyline class="kronosmeshentanglementsvg_line" points="20,113 60,67 100,113 140,62 180,123 220,100 260,126 300,63 340,108 380,83 420,120 460,116 500,118 540,83 580,75 620,64 660,102 700,106" fill="none" stroke="#059669" stroke-width="2.5" filter="url(#kronosmeshentanglementsvg_g)"/>
    <polyline class="kronosmeshentanglementsvg_line" points="20,99 60,68 100,99 140,101 180,80 220,71 260,79 300,84 340,90 380,80 420,123 460,69 500,82 540,103 580,64 620,70 660,86 700,58" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#047857" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#047857" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#047857" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#047857" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#047857" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#34D399" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#0A2D15" stroke="#059669" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#34D399">Graph Topology</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#0A2D15" stroke="#059669" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#34D399">Gossip Protocol</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#0A2D15" stroke="#059669" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#34D399">Byzantine Fault</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#A7F3D0" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#0A2D15" stroke="#047857" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="kronosmeshentanglementsvg_dot" x="120" y="27" width="248" height="14" rx="3" fill="#059669" opacity="0.5" style="animation-delay:0s"/>
      <text x="378" y="38" font-family="monospace" font-size="11" fill="#059669" font-weight="700">92%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="kronosmeshentanglementsvg_dot" x="120" y="55" width="327" height="14" rx="3" fill="#059669" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="457" y="66" font-family="monospace" font-size="11" fill="#059669" font-weight="700">38ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="kronosmeshentanglementsvg_dot" x="120" y="83" width="422" height="14" rx="3" fill="#059669" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="552" y="94" font-family="monospace" font-size="11" fill="#059669" font-weight="700">506/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#047857" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Kronos Mesh Entanglement</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#059669">Graph Topology • Gossip Protocol • Byzantine Fault</text>
  </g>
</svg>