<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_kronos-mesh-entanglement" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    
    <radialGradient id="aura_kronos-mesh-entanglement" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#00F2FF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGrad_kronos-mesh-entanglement" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F2FF" />
    </linearGradient>

    <pattern id="dotGrid_kronos-mesh-entanglement" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <filter id="glow_kronos-mesh-entanglement" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad_kronos-mesh-entanglement)" />
  <rect width="800" height="450" fill="url(#dotGrid_kronos-mesh-entanglement)" />
  <rect width="800" height="450" fill="url(#aura_kronos-mesh-entanglement)" />

  <!-- Outer HUD Frame Border -->
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="url(#accentGrad_kronos-mesh-entanglement)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner HUD Accents -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#10B981" stroke-width="2.5" />
  <path d="M 764 12 L 788 12 L 788 36" fill="none" stroke="#10B981" stroke-width="2.5" />
  <path d="M 12 414 L 12 438 L 36 438" fill="none" stroke="#10B981" stroke-width="2.5" />
  <path d="M 764 438 L 788 438 L 788 414" fill="none" stroke="#10B981" stroke-width="2.5" />

  <!-- Top Telemetry Header -->
  <g transform="translate(32, 38)">
    <circle cx="4" cy="4" r="3.5" fill="#10B981" filter="url(#glow_kronos-mesh-entanglement)" />
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10B981" letter-spacing="1.5">SYS // KRONOS-MESH-ENTANGLEMENT</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(40, 20)">
        <rect x="0" y="0" width="340" height="190" rx="8" fill="#0B132B" stroke="#10B981" stroke-width="1.5" />
        <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#10B981">SPECTRAL GRAPH (FIEDLER VECTOR)</text>
        
        <circle cx="80" cy="70" r="10" fill="#10B981" />
        <circle cx="160" cy="50" r="10" fill="#00F2FF" />
        <circle cx="240" cy="80" r="10" fill="#8B5CF6" />
        <circle cx="200" cy="140" r="10" fill="#10B981" />
        <circle cx="100" cy="130" r="10" fill="#EF4444" />

        <line x1="80" y1="70" x2="160" y2="50" stroke="#334155" stroke-width="2" />
        <line x1="160" y1="50" x2="240" y2="80" stroke="#334155" stroke-width="2" />
        <line x1="240" y1="80" x2="200" y2="140" stroke="#334155" stroke-width="2" />
        <line x1="200" y1="140" x2="100" y2="130" stroke="#334155" stroke-width="2" />
        <line x1="100" y1="130" x2="80" y2="70" stroke="#334155" stroke-width="2" />
        <line x1="80" y1="70" x2="200" y2="140" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3" />

        <text x="20" y="170" font-family="monospace" font-size="8" fill="#94A3B8">O(log N) Spreading • Algebraic Connectivity</text>

        <g transform="translate(370, 0)">
          <rect x="0" y="0" width="350" height="190" rx="8" fill="#0E1626" stroke="#EF4444" stroke-width="1.5" />
          <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#EF4444">33% BYZANTINE FAULT RESILIENCE</text>
          <text x="20" y="60" font-family="monospace" font-size="9" fill="#CBD5E1">Adversarial Node Packet Dropping</text>
          <text x="20" y="85" font-family="monospace" font-size="9" fill="#CBD5E1">Epidemic Dissemination Stability</text>
          <text x="20" y="110" font-family="monospace" font-size="9" fill="#CBD5E1">Cheeger Bound Mixing Guarantees</text>
          <text x="20" y="135" font-family="monospace" font-size="9" fill="#10B981">Zero Partition Collapse Under Churn</text>
        </g>
      </g>
    
  </g>

  <!-- Bottom Identity Bar -->
  <g transform="translate(32, 405)">
    <line x1="0" y1="-12" x2="736" y2="-12" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">Kronos Mesh Entanglement</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Gossip Dissemination • Byzantine Fault Tolerance</text>
  </g>
