<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="briefingbotsvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050D1A"/>
      <stop offset="100%" stop-color="#0A0D15"/>
    </linearGradient>
    <filter id="briefingbotsvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes briefingbotsvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes briefingbotsvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes briefingbotsvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .briefingbotsvg_line { stroke-dasharray:800; animation: briefingbotsvg_draw 4s ease-out forwards; }
      .briefingbotsvg_dot { animation: briefingbotsvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#briefingbotsvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#0284C7" filter="url(#briefingbotsvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#0284C7" font-weight="700" letter-spacing="2">INTELLIGENCE BRIEFING</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#0369A1" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#0A1D35" stroke="#0369A1" stroke-width="1"/>
    <polyline class="briefingbotsvg_line" points="20,63 60,105 100,70 140,121 180,89 220,111 260,89 300,66 340,80 380,90 420,112 460,116 500,106 540,75 580,115 620,90 660,92 700,65" fill="none" stroke="#0284C7" stroke-width="2.5" filter="url(#briefingbotsvg_g)"/>
    <polyline class="briefingbotsvg_line" points="20,80 60,71 100,63 140,85 180,131 220,125 260,61 300,56 340,95 380,114 420,64 460,57 500,63 540,85 580,61 620,127 660,77 700,99" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#0369A1" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#0369A1" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#0369A1" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#0369A1" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#0369A1" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#38BDF8" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#0A1D35" stroke="#0284C7" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#38BDF8">Geopolitical Intel</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#0A1D35" stroke="#0284C7" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#38BDF8">Financial Digest</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#0A1D35" stroke="#0284C7" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#38BDF8">Bias Control</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#BAE6FD" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#0A1D35" stroke="#0369A1" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="briefingbotsvg_dot" x="120" y="27" width="307" height="14" rx="3" fill="#0284C7" opacity="0.5" style="animation-delay:0s"/>
      <text x="437" y="38" font-family="monospace" font-size="11" fill="#0284C7" font-weight="700">97%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="briefingbotsvg_dot" x="120" y="55" width="471" height="14" rx="3" fill="#0284C7" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="601" y="66" font-family="monospace" font-size="11" fill="#0284C7" font-weight="700">35ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="briefingbotsvg_dot" x="120" y="83" width="286" height="14" rx="3" fill="#0284C7" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="416" y="94" font-family="monospace" font-size="11" fill="#0284C7" font-weight="700">792/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#0369A1" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">BriefingBot</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#0284C7">Geopolitical Intel • Financial Digest • Bias Control</text>
  </g>
</svg>