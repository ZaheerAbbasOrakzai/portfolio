<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="triageaisvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0A05"/>
      <stop offset="100%" stop-color="#0D0505"/>
    </linearGradient>
    <filter id="triageaisvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes triageaisvg_pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
      @keyframes triageaisvg_flow { 0%{stroke-dashoffset:30} 100%{stroke-dashoffset:0} }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#triageaisvg_bg)"/>
  
      <g transform="translate(30,65)">
        <text x="0" y="-10" font-family="monospace" font-size="11" fill="#FB923C" font-weight="700">INCIDENT CLASSIFICATION</text>
        <rect x="0" y="0" width="360" height="240" rx="8" fill="#2D1508" stroke="#9A3412" stroke-width="1"/>
        
          <g transform="translate(15,15)">
            <rect width="330" height="45" rx="5" fill="#1A0805" stroke="#EF4444" stroke-width="1"/>
            <text x="10" y="18" font-family="monospace" font-size="10" fill="#EF4444" font-weight="700">🔴 P0 — CRITICAL</text>
            <text x="10" y="35" font-family="monospace" font-size="9" fill="#94A3B8">Database connection pool exhausted</text>
          </g>
        
          <g transform="translate(15,70)">
            <rect width="330" height="45" rx="5" fill="#1A0805" stroke="#F97316" stroke-width="1"/>
            <text x="10" y="18" font-family="monospace" font-size="10" fill="#F97316" font-weight="700">🟠 P1 — HIGH</text>
            <text x="10" y="35" font-family="monospace" font-size="9" fill="#94A3B8">API latency spike > 2000ms on /auth</text>
          </g>
        
          <g transform="translate(15,125)">
            <rect width="330" height="45" rx="5" fill="#1A0805" stroke="#F59E0B" stroke-width="1"/>
            <text x="10" y="18" font-family="monospace" font-size="10" fill="#F59E0B" font-weight="700">🟡 P2 — MEDIUM</text>
            <text x="10" y="35" font-family="monospace" font-size="9" fill="#94A3B8">Cache hit rate dropped below 60%</text>
          </g>
        
          <g transform="translate(15,180)">
            <rect width="330" height="45" rx="5" fill="#1A0805" stroke="#22C55E" stroke-width="1"/>
            <text x="10" y="18" font-family="monospace" font-size="10" fill="#22C55E" font-weight="700">🟢 P3 — LOW</text>
            <text x="10" y="35" font-family="monospace" font-size="9" fill="#94A3B8">Non-critical log rotation warning</text>
          </g>
        
      </g>
      <g transform="translate(420,65)">
        <text x="0" y="-10" font-family="monospace" font-size="11" fill="#FDBA74" font-weight="700">AUTO-GENERATED RUNBOOK</text>
        <rect x="0" y="0" width="350" height="240" rx="8" fill="#2D1508" stroke="#9A3412" stroke-width="1"/>
        <text x="15" y="25" font-family="monospace" font-size="10" fill="#FB923C" font-weight="700">Runbook: DB Pool Exhaustion</text>
        <text x="15" y="50" font-family="monospace" font-size="9" fill="#FDBA74">1. Check active connections:</text>
        <text x="25" y="65" font-family="monospace" font-size="9" fill="#94A3B8">   SHOW PROCESSLIST;</text>
        <text x="15" y="85" font-family="monospace" font-size="9" fill="#FDBA74">2. Kill long-running queries:</text>
        <text x="25" y="100" font-family="monospace" font-size="9" fill="#94A3B8">   KILL [thread_id];</text>
        <text x="15" y="120" font-family="monospace" font-size="9" fill="#FDBA74">3. Increase pool_size in config:</text>
        <text x="25" y="135" font-family="monospace" font-size="9" fill="#94A3B8">   max_connections: 100 → 200</text>
        <text x="15" y="160" font-family="monospace" font-size="9" fill="#FDBA74">4. Add connection timeouts:</text>
        <text x="25" y="175" font-family="monospace" font-size="9" fill="#94A3B8">   idle_timeout: 30s</text>
        <text x="15" y="200" font-family="monospace" font-size="9" fill="#10B981">✓ Routed to: SRE-Team-Alpha</text>
        <text x="15" y="220" font-family="monospace" font-size="9" fill="#10B981">✓ PagerDuty alert: Sent</text>
      </g>
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#9A3412" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">TriageAI</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#F97316">Stack Trace Analysis • Severity Classification • Runbook Gen</text>
  </g>
</svg>