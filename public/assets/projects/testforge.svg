<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="testforgesvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1A0A"/>
      <stop offset="100%" stop-color="#050D05"/>
    </linearGradient>
    <filter id="testforgesvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes testforgesvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes testforgesvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes testforgesvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .testforgesvg_line { stroke-dasharray:800; animation: testforgesvg_draw 4s ease-out forwards; }
      .testforgesvg_dot { animation: testforgesvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#testforgesvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#16A34A" filter="url(#testforgesvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#16A34A" font-weight="700" letter-spacing="2">TEST GENERATION AGENT</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#15803D" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#0A2D0A" stroke="#15803D" stroke-width="1"/>
    <polyline class="testforgesvg_line" points="20,84 60,127 100,101 140,82 180,72 220,96 260,50 300,120 340,66 380,61 420,93 460,62 500,102 540,96 580,116 620,56 660,72 700,63" fill="none" stroke="#16A34A" stroke-width="2.5" filter="url(#testforgesvg_g)"/>
    <polyline class="testforgesvg_line" points="20,80 60,106 100,124 140,85 180,100 220,110 260,116 300,95 340,125 380,67 420,80 460,107 500,101 540,127 580,106 620,90 660,111 700,68" fill="none" stroke="#4ADE80" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#15803D" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#15803D" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#15803D" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#15803D" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#15803D" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#4ADE80" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#0A2D0A" stroke="#16A34A" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#4ADE80">Auto Test Gen</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#0A2D0A" stroke="#16A34A" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#4ADE80">Coverage Analysis</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#0A2D0A" stroke="#16A34A" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#4ADE80">Mock Fixtures</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#BBF7D0" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#0A2D0A" stroke="#15803D" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="testforgesvg_dot" x="120" y="27" width="474" height="14" rx="3" fill="#16A34A" opacity="0.5" style="animation-delay:0s"/>
      <text x="604" y="38" font-family="monospace" font-size="11" fill="#16A34A" font-weight="700">97%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="testforgesvg_dot" x="120" y="55" width="142" height="14" rx="3" fill="#16A34A" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="272" y="66" font-family="monospace" font-size="11" fill="#16A34A" font-weight="700">7ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="testforgesvg_dot" x="120" y="83" width="479" height="14" rx="3" fill="#16A34A" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="609" y="94" font-family="monospace" font-size="11" fill="#16A34A" font-weight="700">360/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#15803D" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">TestForge</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#16A34A">Auto Test Gen • Coverage Analysis • Mock Fixtures</text>
  </g>
</svg>