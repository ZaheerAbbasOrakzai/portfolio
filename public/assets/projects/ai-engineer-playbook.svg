<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="aiengineerplaybooksvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0D0A"/>
      <stop offset="100%" stop-color="#0D0805"/>
    </linearGradient>
    <filter id="aiengineerplaybooksvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes aiengineerplaybooksvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes aiengineerplaybooksvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes aiengineerplaybooksvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .aiengineerplaybooksvg_line { stroke-dasharray:800; animation: aiengineerplaybooksvg_draw 4s ease-out forwards; }
      .aiengineerplaybooksvg_dot { animation: aiengineerplaybooksvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#aiengineerplaybooksvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#D97706" filter="url(#aiengineerplaybooksvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#D97706" font-weight="700" letter-spacing="2">KNOWLEDGE BASE</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#B45309" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#2D1A0A" stroke="#B45309" stroke-width="1"/>
    <polyline class="aiengineerplaybooksvg_line" points="20,50 60,108 100,61 140,89 180,68 220,126 260,95 300,91 340,118 380,68 420,94 460,119 500,82 540,106 580,53 620,107 660,124 700,66" fill="none" stroke="#D97706" stroke-width="2.5" filter="url(#aiengineerplaybooksvg_g)"/>
    <polyline class="aiengineerplaybooksvg_line" points="20,90 60,61 100,91 140,87 180,111 220,69 260,111 300,99 340,55 380,76 420,78 460,114 500,99 540,76 580,83 620,70 660,95 700,94" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#B45309" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#B45309" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#B45309" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#B45309" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#B45309" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#F59E0B" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#2D1A0A" stroke="#D97706" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#F59E0B">Architecture Patterns</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#2D1A0A" stroke="#D97706" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#F59E0B">Design Trade-offs</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#2D1A0A" stroke="#D97706" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#F59E0B">Recipes</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#FDE68A" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#2D1A0A" stroke="#B45309" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="aiengineerplaybooksvg_dot" x="120" y="27" width="103" height="14" rx="3" fill="#D97706" opacity="0.5" style="animation-delay:0s"/>
      <text x="233" y="38" font-family="monospace" font-size="11" fill="#D97706" font-weight="700">92%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="aiengineerplaybooksvg_dot" x="120" y="55" width="450" height="14" rx="3" fill="#D97706" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="580" y="66" font-family="monospace" font-size="11" fill="#D97706" font-weight="700">26ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="aiengineerplaybooksvg_dot" x="120" y="83" width="300" height="14" rx="3" fill="#D97706" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="430" y="94" font-family="monospace" font-size="11" fill="#D97706" font-weight="700">819/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#B45309" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">AI Engineer Playbook</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#D97706">Architecture Patterns • Design Trade-offs • Recipes</text>
  </g>
</svg>