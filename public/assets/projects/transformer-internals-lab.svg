<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="tl_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0A1D"/>
      <stop offset="100%" stop-color="#1A0E3A"/>
    </linearGradient>
    <linearGradient id="tl_acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="tl_glow"><feGaussianBlur stdDeviation="6" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <style>
      @keyframes tl_pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
      @keyframes tl_scan { 0%{transform:translateX(-60px)} 100%{transform:translateX(360px)} }
      @keyframes tl_fade { 0%,100%{opacity:0.4} 50%{opacity:0.9} }
      .tl_cell { animation: tl_pulse 2s ease-in-out infinite; }
      .tl_scanline { animation: tl_scan 3s linear infinite; }
      .tl_head { animation: tl_fade 3s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#tl_bg)"/>
  
