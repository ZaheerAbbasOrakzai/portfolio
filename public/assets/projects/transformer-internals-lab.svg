<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_transformer-internals-lab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    
    <radialGradient id="aura_transformer-internals-lab" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#00F2FF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGrad_transformer-internals-lab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00F2FF" />
    </linearGradient>

    <pattern id="dotGrid_transformer-internals-lab" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <filter id="glow_transformer-internals-lab" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad_transformer-internals-lab)" />
  <rect width="800" height="450" fill="url(#dotGrid_transformer-internals-lab)" />
  <rect width="800" height="450" fill="url(#aura_transformer-internals-lab)" />

  <!-- Outer HUD Frame Border -->
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="url(#accentGrad_transformer-internals-lab)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner HUD Accents -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#8B5CF6" stroke-width="2.5" />
  <path d="M 764 12 L 788 12 L 788 36" fill="none" stroke="#8B5CF6" stroke-width="2.5" />
  <path d="M 12 414 L 12 438 L 36 438" fill="none" stroke="#8B5CF6" stroke-width="2.5" />
  <path d="M 764 438 L 788 438 L 788 414" fill="none" stroke="#8B5CF6" stroke-width="2.5" />

  <!-- Top Telemetry Header -->
  <g transform="translate(32, 38)">
    <circle cx="4" cy="4" r="3.5" fill="#8B5CF6" filter="url(#glow_transformer-internals-lab)" />
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8B5CF6" letter-spacing="1.5">SYS // TRANSFORMER-INTERNALS-LAB</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="200" height="90" rx="8" fill="#0E1626" stroke="#8B5CF6" stroke-width="1.5" />
        <text x="15" y="25" font-family="monospace" font-size="11" font-weight="bold" fill="#8B5CF6">QUERY (Q) MATRIX</text>
        <text x="15" y="45" font-family="monospace" font-size="9" fill="#94A3B8">d_model: 768 • Heads: 12</text>
        <text x="15" y="65" font-family="monospace" font-size="9" fill="#64748B">W_q Projected Tensors</text>

        <rect x="250" y="0" width="200" height="90" rx="8" fill="#0E1626" stroke="#00F2FF" stroke-width="1.5" />
        <text x="265" y="25" font-family="monospace" font-size="11" font-weight="bold" fill="#00F2FF">KEY (K) MATRIX</text>
        <text x="265" y="45" font-family="monospace" font-size="9" fill="#94A3B8">Scaled Dot-Product</text>
        <text x="265" y="65" font-family="monospace" font-size="9" fill="#64748B">Softmax(QK^T / sqrt(d_k))</text>

        <rect x="500" y="0" width="200" height="90" rx="8" fill="#0E1626" stroke="#10B981" stroke-width="1.5" />
        <text x="515" y="25" font-family="monospace" font-size="11" font-weight="bold" fill="#10B981">VALUE (V) WEIGHTS</text>
        <text x="515" y="45" font-family="monospace" font-size="9" fill="#94A3B8">Context Aggregation</text>
        <text x="515" y="65" font-family="monospace" font-size="9" fill="#64748B">Residual Head Mixing</text>

        <path d="M 200 45 L 250 45" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,4" />
        <path d="M 450 45 L 500 45" stroke="#00F2FF" stroke-width="2" stroke-dasharray="4,4" />

        <g transform="translate(0, 120)">
          <rect x="0" y="0" width="700" height="55" rx="8" fill="#0B132B" stroke="#334155" stroke-width="1" />
          <path d="M 20 28 L 680 28" stroke="#00F2FF" stroke-width="2.5" />
          <circle cx="120" cy="28" r="6" fill="#8B5CF6" />
          <circle cx="350" cy="28" r="6" fill="#00F2FF" />
          <circle cx="580" cy="28" r="6" fill="#10B981" />
          <text x="20" y="-8" font-family="monospace" font-size="10" fill="#94A3B8">RESIDUAL STREAM VECTOR HIGHWAY (L0 -> L12)</text>
          <text x="135" y="32" font-family="monospace" font-size="9" fill="#F8FAFC">LayerNorm</text>
          <text x="365" y="32" font-family="monospace" font-size="9" fill="#F8FAFC">MLP Projection</text>
          <text x="595" y="32" font-family="monospace" font-size="9" fill="#F8FAFC">Logit Lens</text>
        </g>
      </g>
    
  </g>

  <!-- Bottom Identity Bar -->
  <g transform="translate(32, 405)">
    <line x1="0" y1="-12" x2="736" y2="-12" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">Transformer Internals Lab</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">QKV Attention • Residual Streams • Logit Lens</text>
  </g>
</svg>