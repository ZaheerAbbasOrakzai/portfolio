    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#EF4444" letter-spacing="1.5">SYS // AEGIS-CODE-LINTER</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(50, 20)">
        <rect x="0" y="0" width="300" height="190" rx="8" fill="#0B132B" stroke="#EF4444" stroke-width="1.5" />
        <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#EF4444">AST SYNTAX TREE & TAINT SCAN</text>
        
        <g stroke="#64748B" stroke-width="1.5">
          <line x1="150" y1="50" x2="80" y2="90" />
          <line x1="150" y1="50" x2="220" y2="90" />
          <line x1="80" y1="90" x2="40" y2="135" />
          <line x1="80" y1="90" x2="120" y2="135" />
          <line x1="220" y1="90" x2="180" y2="135" />
          <line x1="220" y1="90" x2="260" y2="135" />
        </g>
        <circle cx="150" cy="50" r="10" fill="#00F2FF" />
        <circle cx="80" cy="90" r="8" fill="#8B5CF6" />
        <circle cx="220" cy="90" r="8" fill="#8B5CF6" />
        <circle cx="40" cy="135" r="7" fill="#10B981" />
        <circle cx="120" cy="135" r="8" fill="#EF4444" />
        <circle cx="180" cy="135" r="7" fill="#10B981" />
        <circle cx="260" cy="135" r="7" fill="#10B981" />
        <text x="135" y="165" font-family="monospace" font-size="9" fill="#EF4444">SQLi Taint Node</text>

        <g transform="translate(330, 0)">
          <rect x="0" y="0" width="360" height="190" rx="8" fill="#0E1626" stroke="#1E293B" stroke-width="1" />
          <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#F8FAFC">SARIF 2.1.0 COMPLIANCE</text>
          
          <rect x="20" y="45" width="320" height="35" rx="4" fill="#1F1515" stroke="#EF4444" stroke-width="1" />
          <text x="30" y="67" font-family="monospace" font-size="9" fill="#EF4444">[HIGH] CWE-89 SQL Injection detected at L42</text>

          <rect x="20" y="90" width="320" height="35" rx="4" fill="#1E1C12" stroke="#F59E0B" stroke-width="1" />
          <text x="30" y="112" font-family="monospace" font-size="9" fill="#F59E0B">[WARN] Hardcoded High-Entropy Token (AWS Key)</text>

          <rect x="20" y="135" width="320" height="35" rx="4" fill="#0E1E17" stroke="#10B981" stroke-width="1" />
          <text x="30" y="157" font-family="monospace" font-size="9" fill="#10B981">[FIXED] RedBaron Auto-Patch AST Transformed</text>
        </g>
      </g>
    
  </g>

  <!-- Bottom Identity Bar -->
  <g transform="translate(32, 405)">
    <line x1="0" y1="-12" x2="736" y2="-12" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">Aegis Code Linter</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">AST Tree-Sitter Traversal • OWASP Top 10 Security</text>
  </g>
</svg>