<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_datalens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    
    <radialGradient id="aura_datalens" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#00F2FF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGrad_datalens" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#00F2FF" />
    </linearGradient>

    <pattern id="dotGrid_datalens" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <filter id="glow_datalens" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad_datalens)" />
  <rect width="800" height="450" fill="url(#dotGrid_datalens)" />
  <rect width="800" height="450" fill="url(#aura_datalens)" />

  <!-- Outer HUD Frame Border -->
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="url(#accentGrad_datalens)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner HUD Accents -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <path d="M 764 12 L 788 12 L 788 36" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <path d="M 12 414 L 12 438 L 36 438" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <path d="M 764 438 L 788 438 L 788 414" fill="none" stroke="#F59E0B" stroke-width="2.5" />

  <!-- Top Telemetry Header -->
  <g transform="translate(32, 38)">
    <circle cx="4" cy="4" r="3.5" fill="#F59E0B" filter="url(#glow_datalens)" />
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="1.5">SYS // DATALENS</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(40, 20)">
        <rect x="0" y="0" width="320" height="190" rx="8" fill="#0B132B" stroke="#F59E0B" stroke-width="1.5" />
        <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#F59E0B">DISTRIBUTION CURVES & SKEW</text>
        <path d="M 30 140 Q 90 20 160 140 T 290 140" fill="none" stroke="#F59E0B" stroke-width="2.5" />
        <line x1="30" y1="140" x2="290" y2="140" stroke="#334155" />
        <text x="20" y="165" font-family="monospace" font-size="9" fill="#94A3B8">Skewness: +0.42 • Kurtosis: 3.12</text>

        <g transform="translate(350, 0)">
          <rect x="0" y="0" width="370" height="190" rx="8" fill="#0E1626" stroke="#00F2FF" stroke-width="1.5" />
          <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#00F2FF">PEARSON / SPEARMAN CORRELATION MATRIX</text>
          
          <g transform="translate(30, 45)">
            <rect x="0" y="0" width="35" height="35" fill="#00F2FF" fill-opacity="0.9" />
            <rect x="40" y="0" width="35" height="35" fill="#8B5CF6" fill-opacity="0.7" />
            <rect x="80" y="0" width="35" height="35" fill="#F59E0B" fill-opacity="0.3" />

            <rect x="0" y="40" width="35" height="35" fill="#8B5CF6" fill-opacity="0.7" />
            <rect x="40" y="40" width="35" height="35" fill="#00F2FF" fill-opacity="0.9" />
            <rect x="80" y="40" width="35" height="35" fill="#10B981" fill-opacity="0.5" />

            <rect x="0" y="80" width="35" height="35" fill="#F59E0B" fill-opacity="0.3" />
            <rect x="40" y="80" width="35" height="35" fill="#10B981" fill-opacity="0.5" />
            <rect x="80" y="80" width="35" height="35" fill="#00F2FF" fill-opacity="0.9" />
          </g>
          <text x="170" y="70" font-family="monospace" font-size="9" fill="#CBD5E1">1M+ Rows Supported</text>
          <text x="170" y="95" font-family="monospace" font-size="9" fill="#CBD5E1">12+ Hypothesis Tests</text>
          <text x="170" y="120" font-family="monospace" font-size="9" fill="#10B981">Report: &lt;10 seconds</text>
        </g>
      </g>
    
  </g>

  <!-- Bottom Identity Bar -->
  <g transform="translate(32, 405)">
    <line x1="0" y1="-12" x2="736" y2="-12" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">DataLens Automated EDA</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Hypothesis Testing • Distribution & Skewness Profiler</text>
  </g>
</svg>