<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="datalenssvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#051A1A"/>
      <stop offset="100%" stop-color="#0A0D1A"/>
    </linearGradient>
    <filter id="datalenssvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes datalenssvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes datalenssvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes datalenssvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .datalenssvg_line { stroke-dasharray:800; animation: datalenssvg_draw 4s ease-out forwards; }
      .datalenssvg_dot { animation: datalenssvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#datalenssvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#06B6D4" filter="url(#datalenssvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#06B6D4" font-weight="700" letter-spacing="2">AUTONOMOUS EDA ENGINE</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#155E75" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#0A2535" stroke="#155E75" stroke-width="1"/>
    <polyline class="datalenssvg_line" points="20,53 60,62 100,86 140,85 180,101 220,113 260,60 300,72 340,56 380,127 420,72 460,50 500,78 540,72 580,61 620,60 660,73 700,74" fill="none" stroke="#06B6D4" stroke-width="2.5" filter="url(#datalenssvg_g)"/>
    <polyline class="datalenssvg_line" points="20,124 60,82 100,130 140,73 180,56 220,59 260,73 300,57 340,124 380,112 420,74 460,120 500,111 540,96 580,80 620,118 660,86 700,81" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#155E75" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#155E75" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#155E75" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#155E75" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#155E75" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#22D3EE" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#0A2535" stroke="#06B6D4" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#22D3EE">Auto EDA</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#0A2535" stroke="#06B6D4" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#22D3EE">Distribution Detection</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#0A2535" stroke="#06B6D4" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#22D3EE">Correlation Heatmaps</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#A5F3FC" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#0A2535" stroke="#155E75" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="datalenssvg_dot" x="120" y="27" width="293" height="14" rx="3" fill="#06B6D4" opacity="0.5" style="animation-delay:0s"/>
      <text x="423" y="38" font-family="monospace" font-size="11" fill="#06B6D4" font-weight="700">90%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="datalenssvg_dot" x="120" y="55" width="257" height="14" rx="3" fill="#06B6D4" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="387" y="66" font-family="monospace" font-size="11" fill="#06B6D4" font-weight="700">10ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="datalenssvg_dot" x="120" y="83" width="259" height="14" rx="3" fill="#06B6D4" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="389" y="94" font-family="monospace" font-size="11" fill="#06B6D4" font-weight="700">518/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#155E75" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">DataLens</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#06B6D4">Auto EDA • Distribution Detection • Correlation Heatmaps</text>
  </g>
</svg>