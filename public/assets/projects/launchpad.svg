<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="launchpadsvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A100A"/>
      <stop offset="100%" stop-color="#0D0805"/>
    </linearGradient>
    <filter id="launchpadsvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes launchpadsvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes launchpadsvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes launchpadsvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .launchpadsvg_line { stroke-dasharray:800; animation: launchpadsvg_draw 4s ease-out forwards; }
      .launchpadsvg_dot { animation: launchpadsvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#launchpadsvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#EA580C" filter="url(#launchpadsvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#EA580C" font-weight="700" letter-spacing="2">CAREER STRATEGY</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#C2410C" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#2D180A" stroke="#C2410C" stroke-width="1"/>
    <polyline class="launchpadsvg_line" points="20,129 60,61 100,93 140,84 180,128 220,113 260,113 300,96 340,64 380,102 420,112 460,94 500,54 540,52 580,105 620,84 660,97 700,94" fill="none" stroke="#EA580C" stroke-width="2.5" filter="url(#launchpadsvg_g)"/>
    <polyline class="launchpadsvg_line" points="20,83 60,71 100,102 140,134 180,89 220,94 260,84 300,89 340,73 380,126 420,102 460,119 500,105 540,76 580,114 620,70 660,126 700,106" fill="none" stroke="#FB923C" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#C2410C" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#C2410C" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#C2410C" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#C2410C" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#C2410C" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#FB923C" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#2D180A" stroke="#EA580C" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#FB923C">Cover Letters</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#2D180A" stroke="#EA580C" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#FB923C">Interview Prep</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#2D180A" stroke="#EA580C" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#FB923C">Salary Negotiation</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#FED7AA" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#2D180A" stroke="#C2410C" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="launchpadsvg_dot" x="120" y="27" width="128" height="14" rx="3" fill="#EA580C" opacity="0.5" style="animation-delay:0s"/>
      <text x="258" y="38" font-family="monospace" font-size="11" fill="#EA580C" font-weight="700">87%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="launchpadsvg_dot" x="120" y="55" width="400" height="14" rx="3" fill="#EA580C" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="530" y="66" font-family="monospace" font-size="11" fill="#EA580C" font-weight="700">39ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="launchpadsvg_dot" x="120" y="83" width="113" height="14" rx="3" fill="#EA580C" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="243" y="94" font-family="monospace" font-size="11" fill="#EA580C" font-weight="700">737/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#C2410C" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Launchpad</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#EA580C">Cover Letters • Interview Prep • Salary Negotiation</text>
  </g>
</svg>