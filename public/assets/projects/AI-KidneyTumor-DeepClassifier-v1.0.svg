      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    
    <radialGradient id="aura_AI-KidneyTumor-DeepClassifier-v1.0" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#00F2FF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGrad_AI-KidneyTumor-DeepClassifier-v1.0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#00F2FF" />
    </linearGradient>

    <pattern id="dotGrid_AI-KidneyTumor-DeepClassifier-v1.0" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
