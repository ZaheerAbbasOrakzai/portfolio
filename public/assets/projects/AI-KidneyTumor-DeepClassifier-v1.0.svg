<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="idneyumoreeplassifierv10svg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1A1A"/>
      <stop offset="100%" stop-color="#051010"/>
    </linearGradient>
    <filter id="idneyumoreeplassifierv10svg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes idneyumoreeplassifierv10svg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes idneyumoreeplassifierv10svg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes idneyumoreeplassifierv10svg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .idneyumoreeplassifierv10svg_line { stroke-dasharray:800; animation: idneyumoreeplassifierv10svg_draw 4s ease-out forwards; }
      .idneyumoreeplassifierv10svg_dot { animation: idneyumoreeplassifierv10svg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#idneyumoreeplassifierv10svg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#0891B2" filter="url(#idneyumoreeplassifierv10svg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#0891B2" font-weight="700" letter-spacing="2">DEEP LEARNING CLASSIFIER</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#0E7490" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
