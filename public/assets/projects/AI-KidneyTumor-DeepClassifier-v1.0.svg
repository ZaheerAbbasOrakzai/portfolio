    <polyline class="idneyumoreeplassifierv10svg_line" points="20,85 60,111 100,109 140,101 180,72 220,112 260,118 300,67 340,74 380,61 420,106 460,97 500,101 540,88 580,68 620,96 660,68 700,114" fill="none" stroke="#0891B2" stroke-width="2.5" filter="url(#idneyumoreeplassifierv10svg_g)"/>
    <polyline class="idneyumoreeplassifierv10svg_line" points="20,93 60,84 100,116 140,80 180,85 220,93 260,108 300,81 340,124 380,92 420,120 460,72 500,60 540,67 580,124 620,104 660,67 700,99" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#0E7490" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#0E7490" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#0E7490" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#0E7490" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#0E7490" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#22D3EE" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#0A2530" stroke="#0891B2" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#22D3EE">CNN</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#0A2530" stroke="#0891B2" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#22D3EE">CT Scan Analysis</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#0A2530" stroke="#0891B2" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#22D3EE">Medical Imaging</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#A5F3FC" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#0A2530" stroke="#0E7490" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
