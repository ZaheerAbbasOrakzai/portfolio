    </pattern>

    <filter id="glow_AI-KidneyTumor-DeepClassifier-v1.0" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad_AI-KidneyTumor-DeepClassifier-v1.0)" />
  <rect width="800" height="450" fill="url(#dotGrid_AI-KidneyTumor-DeepClassifier-v1.0)" />
  <rect width="800" height="450" fill="url(#aura_AI-KidneyTumor-DeepClassifier-v1.0)" />

  <!-- Outer HUD Frame Border -->
