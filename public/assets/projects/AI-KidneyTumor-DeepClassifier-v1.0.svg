      <text x="231" y="66" font-family="monospace" font-size="11" fill="#0891B2" font-weight="700">25ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="idneyumoreeplassifierv10svg_dot" x="120" y="83" width="172" height="14" rx="3" fill="#0891B2" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="302" y="94" font-family="monospace" font-size="11" fill="#0891B2" font-weight="700">285/s</text>
  </g>
  
