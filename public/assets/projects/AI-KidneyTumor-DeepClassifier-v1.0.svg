          <text x="20" y="110" font-family="monospace" font-size="9" fill="#CBD5E1">DVC Dataset Versioning Pipeline</text>
          <text x="20" y="135" font-family="monospace" font-size="9" fill="#CBD5E1">MLflow Model Registry Tracked</text>
          <text x="20" y="160" font-family="monospace" font-size="9" fill="#10B981">Verified Clinician Visual Review</text>
        </g>
      </g>
    
