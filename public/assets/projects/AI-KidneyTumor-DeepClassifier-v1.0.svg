    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(50, 20)">
        <rect x="0" y="0" width="280" height="190" rx="8" fill="#0B132B" stroke="#EF4444" stroke-width="1.5" />
        <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#EF4444">CT SLICE HOUNSFIELD WINDOW</text>
        
        <circle cx="140" cy="110" r="50" fill="#0E1626" stroke="#334155" stroke-width="2" />
        <ellipse cx="140" cy="110" rx="35" ry="25" fill="#1E293B" />
        <circle cx="155" cy="105" r="14" fill="#EF4444" fill-opacity="0.8" />
        <text x="155" y="108" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#FFFFFF">TUMOR</text>
        <text x="20" y="175" font-family="monospace" font-size="8" fill="#94A3B8">Validation Accuracy: 97.2%</text>

        <g transform="translate(320, 0)">
