<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="df_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0510"/>
      <stop offset="100%" stop-color="#0D0A1A"/>
    </linearGradient>
    <style>
      @keyframes df_flow { 0%{stroke-dashoffset:30} 100%{stroke-dashoffset:0} }
      @keyframes df_spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
      @keyframes df_pulse { 0%,100%{opacity:0.3;r:4} 50%{opacity:1;r:7} }
      .df_pipe { stroke-dasharray:8 6; animation: df_flow 1s linear infinite; }
      .df_node { animation: df_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#df_bg)"/>
  
  <!-- Pipeline stages -->
  
    <g>
      <rect x="30" y="120" width="130" height="70" rx="10" fill="#2D0A15" stroke="#F43F5E" stroke-width="1.5"/>
      <text x="95" y="150" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" font-weight="800" fill="#F43F5E">RAW CORPUS</text>
      <text x="95" y="170" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">Web + Docs</text>
      <line class="df_pipe" x1="160" y1="155" x2="190" y2="155" stroke="#F43F5E" stroke-width="2"/>
    </g>
  
    <g>
      <rect x="200" y="120" width="130" height="70" rx="10" fill="#2D0A20" stroke="#EC4899" stroke-width="1.5"/>
      <text x="265" y="150" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" font-weight="800" fill="#EC4899">EXTRACTION</text>
      <text x="265" y="170" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">Entity + Schema</text>
      <line class="df_pipe" x1="330" y1="155" x2="360" y2="155" stroke="#EC4899" stroke-width="2"/>
    </g>
  
    <g>
      <rect x="370" y="120" width="130" height="70" rx="10" fill="#25082D" stroke="#D946EF" stroke-width="1.5"/>
      <text x="435" y="150" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" font-weight="800" fill="#D946EF">INSTRUCTION</text>
      <text x="435" y="170" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">QA Pair Forge</text>
      <line class="df_pipe" x1="500" y1="155" x2="530" y2="155" stroke="#D946EF" stroke-width="2"/>
    </g>
  
    <g>
      <rect x="540" y="120" width="130" height="70" rx="10" fill="#1D0A2D" stroke="#A855F7" stroke-width="1.5"/>
      <text x="605" y="150" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" font-weight="800" fill="#A855F7">QUALITY</text>
      <text x="605" y="170" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">Dedup + Score</text>
      <line class="df_pipe" x1="670" y1="155" x2="700" y2="155" stroke="#A855F7" stroke-width="2"/>
    </g>
  
    <g>
      <rect x="680" y="120" width="100" height="70" rx="10" fill="#160A2D" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="730" y="150" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" font-weight="800" fill="#8B5CF6">EXPORT</text>
      <text x="730" y="170" text-anchor="middle" font-family="monospace" font-size="9" fill="#94A3B8">JSONL / Parquet</text>
      
    </g>
  
  
  <!-- Data volume indicators -->
  <g transform="translate(30,230)">
    <text x="0" y="0" font-family="'JetBrains Mono',monospace" font-size="11" fill="#F43F5E" font-weight="700" letter-spacing="2">PIPELINE TELEMETRY</text>
    <rect x="0" y="10" width="740" height="120" rx="8" fill="#1A0812" stroke="#831843" stroke-width="1"/>
    
      <text x="15" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Documents Processed</text>
      <rect x="200" y="27" width="340" height="14" rx="3" fill="#F43F5E" opacity="0.6"/>
      <text x="550" y="38" font-family="monospace" font-size="10" fill="#F43F5E" font-weight="700">2.4M</text>
    
      <text x="15" y="63" font-family="monospace" font-size="10" fill="#94A3B8">Instruction Pairs</text>
      <rect x="200" y="52" width="260" height="14" rx="3" fill="#EC4899" opacity="0.6"/>
      <text x="470" y="63" font-family="monospace" font-size="10" fill="#EC4899" font-weight="700">890K</text>
    
      <text x="15" y="88" font-family="monospace" font-size="10" fill="#94A3B8">Post-Dedup Unique</text>
      <rect x="200" y="77" width="215" height="14" rx="3" fill="#D946EF" opacity="0.6"/>
      <text x="425" y="88" font-family="monospace" font-size="10" fill="#D946EF" font-weight="700">742K</text>
    
      <text x="15" y="113" font-family="monospace" font-size="10" fill="#94A3B8">Quality Score > 0.85</text>
      <rect x="200" y="102" width="180" height="14" rx="3" fill="#A855F7" opacity="0.6"/>
      <text x="390" y="113" font-family="monospace" font-size="10" fill="#A855F7" font-weight="700">614K</text>
    
  </g>
  
  <!-- Animated data particles -->
  <circle class="df_node" cx="80" cy="105" r="4" fill="#F43F5E" style="animation-delay:0s"/>
  <circle class="df_node" cx="210" cy="105" r="4" fill="#F43F5E" style="animation-delay:0.4s"/>
  <circle class="df_node" cx="340" cy="105" r="4" fill="#F43F5E" style="animation-delay:0.8s"/>
  <circle class="df_node" cx="470" cy="105" r="4" fill="#F43F5E" style="animation-delay:1.2000000000000002s"/>
  <circle class="df_node" cx="600" cy="105" r="4" fill="#F43F5E" style="animation-delay:1.6s"/>
  <circle class="df_node" cx="730" cy="105" r="4" fill="#F43F5E" style="animation-delay:2s"/>
  
  <g transform="translate(30,410)">
    <text x="0" y="10" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">DataForge LLM</text>
    <text x="740" y="10" text-anchor="end" font-family="monospace" font-size="11" fill="#F43F5E">Synthetic Data • Instruction Tuning • Quality Scoring</text>
  </g>
</svg>