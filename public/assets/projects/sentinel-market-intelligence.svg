        <text x="15" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#F59E0B">SEC EDGAR INGEST</text>
        <text x="15" y="55" font-family="monospace" font-size="9" fill="#CBD5E1">Form 10-K / 10-Q Feeds</text>
