        <rect x="260" y="0" width="210" height="190" rx="8" fill="#0E1626" stroke="#8B5CF6" stroke-width="1.5" />
        <text x="275" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#8B5CF6">FINANCIAL RAG ENGINE</text>
        <text x="275" y="55" font-family="monospace" font-size="9" fill="#CBD5E1">XBRL Tag Vectorization</text>
        <text x="275" y="75" font-family="monospace" font-size="9" fill="#94A3B8">Dense Footnote Index</text>
        <text x="275" y="95" font-family="monospace" font-size="9" fill="#94A3B8">Citation Traceability</text>
        <line x1="275" y1="115" x2="455" y2="115" stroke="#334155" />
        <text x="275" y="135" font-family="monospace" font-size="9" fill="#8B5CF6">BGE-Reranker Score</text>
        <text x="275" y="155" font-family="monospace" font-size="9" fill="#00F2FF">Paragraph Direct Anchors</text>

        <path d="M 470 95 L 520 95" stroke="#8B5CF6" stroke-width="2" />

        <rect x="520" y="0" width="190" height="190" rx="8" fill="#0E1626" stroke="#10B981" stroke-width="1.5" />
        <text x="535" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#10B981">EXEC BRIEFING</text>
        <text x="535" y="55" font-family="monospace" font-size="9" fill="#CBD5E1">Moat Shift Analysis</text>
        <text x="535" y="75" font-family="monospace" font-size="9" fill="#94A3B8">Revenue Guidance</text>
        <text x="535" y="95" font-family="monospace" font-size="9" fill="#94A3B8">Regulatory Risk Delta</text>
        <line x1="535" y1="115" x2="695" y2="115" stroke="#334155" />
        <text x="535" y="135" font-family="monospace" font-size="9" fill="#10B981">Synthesis: &lt;45s</text>
        <text x="535" y="155" font-family="monospace" font-size="9" fill="#F8FAFC">Board-Ready PDF</text>
