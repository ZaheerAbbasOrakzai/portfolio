<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_AI-GoldPrice-ForecastingSystem-v1.0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    
    <radialGradient id="aura_AI-GoldPrice-ForecastingSystem-v1.0" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGrad_AI-GoldPrice-ForecastingSystem-v1.0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <pattern id="dotGrid_AI-GoldPrice-ForecastingSystem-v1.0" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <filter id="glow_AI-GoldPrice-ForecastingSystem-v1.0" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad_AI-GoldPrice-ForecastingSystem-v1.0)" />
  <rect width="800" height="450" fill="url(#dotGrid_AI-GoldPrice-ForecastingSystem-v1.0)" />
  <rect width="800" height="450" fill="url(#aura_AI-GoldPrice-ForecastingSystem-v1.0)" />

  <!-- Outer HUD Frame Border -->
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="url(#accentGrad_AI-GoldPrice-ForecastingSystem-v1.0)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner HUD Accents -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <path d="M 764 12 L 788 12 L 788 36" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <path d="M 12 414 L 12 438 L 36 438" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <path d="M 764 438 L 788 438 L 788 414" fill="none" stroke="#F59E0B" stroke-width="2.5" />

  <!-- Top Telemetry Header -->
