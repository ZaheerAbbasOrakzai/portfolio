    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(40, 20)">
        <rect x="0" y="0" width="340" height="190" rx="8" fill="#0B132B" stroke="#F59E0B" stroke-width="1.5" />
        <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#F59E0B">XAU / USD VOLATILITY CURVE</text>
        <path d="M 20 140 Q 80 80 140 110 T 260 50 T 320 30" fill="none" stroke="#F59E0B" stroke-width="2.5" />
        <text x="20" y="165" font-family="monospace" font-size="9" fill="#94A3B8">RMSE: $18.40 • R^2 Score: 0.942</text>

        <g transform="translate(370, 0)">
