          <text x="20" y="110" font-family="monospace" font-size="9" fill="#CBD5E1">• S&amp;P 500 &amp; Crude Oil Lags</text>
          <text x="20" y="135" font-family="monospace" font-size="9" fill="#CBD5E1">• Bidirectional LSTM + Random Forest</text>
          <text x="20" y="160" font-family="monospace" font-size="9" fill="#10B981">Out-of-Sample Walk-Forward Validated</text>
        </g>
      </g>
    
  </g>

