<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="marketmindsvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0A1A"/>
      <stop offset="100%" stop-color="#08051A"/>
    </linearGradient>
    <filter id="marketmindsvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes marketmindsvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes marketmindsvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes marketmindsvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .marketmindsvg_line { stroke-dasharray:800; animation: marketmindsvg_draw 4s ease-out forwards; }
      .marketmindsvg_dot { animation: marketmindsvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#marketmindsvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#7C3AED" filter="url(#marketmindsvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#7C3AED" font-weight="700" letter-spacing="2">COMPETITIVE INTEL</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#6D28D9" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#150D35" stroke="#6D28D9" stroke-width="1"/>
    <polyline class="marketmindsvg_line" points="20,110 60,97 100,83 140,54 180,102 220,110 260,54 300,68 340,113 380,106 420,112 460,119 500,91 540,95 580,62 620,53 660,68 700,77" fill="none" stroke="#7C3AED" stroke-width="2.5" filter="url(#marketmindsvg_g)"/>
    <polyline class="marketmindsvg_line" points="20,60 60,104 100,99 140,59 180,57 220,117 260,88 300,115 340,85 380,65 420,76 460,117 500,106 540,82 580,60 620,121 660,98 700,63" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#6D28D9" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#6D28D9" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#6D28D9" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#6D28D9" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#6D28D9" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#A78BFA" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#150D35" stroke="#7C3AED" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#A78BFA">GTM Strategy</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#150D35" stroke="#7C3AED" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#A78BFA">Competitive Landscape</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#150D35" stroke="#7C3AED" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#A78BFA">Board Reports</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#DDD6FE" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#150D35" stroke="#6D28D9" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="marketmindsvg_dot" x="120" y="27" width="107" height="14" rx="3" fill="#7C3AED" opacity="0.5" style="animation-delay:0s"/>
      <text x="237" y="38" font-family="monospace" font-size="11" fill="#7C3AED" font-weight="700">88%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="marketmindsvg_dot" x="120" y="55" width="365" height="14" rx="3" fill="#7C3AED" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="495" y="66" font-family="monospace" font-size="11" fill="#7C3AED" font-weight="700">34ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="marketmindsvg_dot" x="120" y="83" width="446" height="14" rx="3" fill="#7C3AED" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="576" y="94" font-family="monospace" font-size="11" fill="#7C3AED" font-weight="700">646/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#6D28D9" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">MarketMind</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#7C3AED">GTM Strategy • Competitive Landscape • Board Reports</text>
  </g>
</svg>