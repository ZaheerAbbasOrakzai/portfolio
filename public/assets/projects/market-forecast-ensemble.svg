<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_market-forecast-ensemble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    
    <radialGradient id="aura_market-forecast-ensemble" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#00F2FF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGrad_market-forecast-ensemble" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#00F2FF" />
    </linearGradient>

    <pattern id="dotGrid_market-forecast-ensemble" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <filter id="glow_market-forecast-ensemble" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad_market-forecast-ensemble)" />
  <rect width="800" height="450" fill="url(#dotGrid_market-forecast-ensemble)" />
  <rect width="800" height="450" fill="url(#aura_market-forecast-ensemble)" />

  <!-- Outer HUD Frame Border -->
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="url(#accentGrad_market-forecast-ensemble)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner HUD Accents -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <path d="M 764 12 L 788 12 L 788 36" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <path d="M 12 414 L 12 438 L 36 438" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <path d="M 764 438 L 788 438 L 788 414" fill="none" stroke="#F59E0B" stroke-width="2.5" />

  <!-- Top Telemetry Header -->
  <g transform="translate(32, 38)">
    <circle cx="4" cy="4" r="3.5" fill="#F59E0B" filter="url(#glow_market-forecast-ensemble)" />
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="1.5">SYS // MARKET-FORECAST-ENSEMBLE</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(30, 20)">
        <rect x="0" y="0" width="420" height="190" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
        <path d="M 20 150 Q 80 110 140 130 T 260 70 T 400 30" fill="none" stroke="#F59E0B" stroke-width="2.5" />
        <path d="M 260 70 Q 330 50 400 20 L 400 60 Q 330 90 260 70 Z" fill="#F59E0B" fill-opacity="0.15" />
        
        <g stroke="#10B981" stroke-width="2">
          <line x1="60" y1="120" x2="60" y2="145" />
          <rect x="56" y="125" width="8" height="15" fill="#10B981" />
          <line x1="120" y1="105" x2="120" y2="135" />
          <rect x="116" y="110" width="8" height="18" fill="#10B981" />
        </g>
        <g stroke="#EF4444" stroke-width="2">
          <line x1="90" y1="115" x2="90" y2="140" />
          <rect x="86" y="120" width="8" height="12" fill="#EF4444" />
        </g>

        <g transform="translate(450, 0)">
          <rect x="0" y="0" width="250" height="55" rx="6" fill="#0E1626" stroke="#F59E0B" stroke-width="1.5" />
          <text x="15" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#F59E0B">DEEP GRU RECURRENT</text>
          <text x="15" y="42" font-family="monospace" font-size="9" fill="#94A3B8">Temporal Sequential Memory</text>

          <rect x="0" y="65" width="250" height="55" rx="6" fill="#0E1626" stroke="#00F2FF" stroke-width="1.5" />
          <text x="15" y="89" font-family="monospace" font-size="11" font-weight="bold" fill="#00F2FF">BOOSTED TREES (XGB)</text>
          <text x="15" y="107" font-family="monospace" font-size="9" fill="#94A3B8">Non-linear Feature Splits</text>

          <rect x="0" y="130" width="250" height="55" rx="6" fill="#0E1626" stroke="#10B981" stroke-width="1.5" />
          <text x="15" y="154" font-family="monospace" font-size="11" font-weight="bold" fill="#10B981">ARIMA RESIDUAL</text>
          <text x="15" y="172" font-family="monospace" font-size="9" fill="#94A3B8">Stationary Autoregression</text>
        </g>
      </g>
    
  </g>

  <!-- Bottom Identity Bar -->
  <g transform="translate(32, 405)">
    <line x1="0" y1="-12" x2="736" y2="-12" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">Market Forecast Ensemble</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Deep GRU • XGBoost Gradient Boosting • ARIMA</text>
  </g>
