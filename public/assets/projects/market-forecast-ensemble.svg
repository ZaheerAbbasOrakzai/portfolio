<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="mf_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1005"/>
      <stop offset="100%" stop-color="#0D0A05"/>
    </linearGradient>
    <filter id="mf_g"><feGaussianBlur stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes mf_draw { 0%{stroke-dashoffset:600} 100%{stroke-dashoffset:0} }
      @keyframes mf_blink { 0%,100%{opacity:0.4} 50%{opacity:1} }
      .mf_line { stroke-dasharray:600; animation: mf_draw 4s ease-out forwards; }
      .mf_dot { animation: mf_blink 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#mf_bg)"/>
  
  <!-- Candlestick Chart -->
  <g transform="translate(40,40)">
    <text x="0" y="0" font-family="'JetBrains Mono',monospace" font-size="11" fill="#F59E0B" font-weight="700" letter-spacing="2">MULTI-MODEL ENSEMBLE FORECAST</text>
    <rect x="0" y="10" width="460" height="250" rx="6" fill="#1A1308" stroke="#92400E" stroke-width="1"/>
    <!-- Grid lines -->
    <line x1="10" y1="30" x2="450" y2="30" stroke="#44300A" stroke-width="0.5"/>
    <line x1="10" y1="80" x2="450" y2="80" stroke="#44300A" stroke-width="0.5"/>
    <line x1="10" y1="130" x2="450" y2="130" stroke="#44300A" stroke-width="0.5"/>
    <line x1="10" y1="180" x2="450" y2="180" stroke="#44300A" stroke-width="0.5"/>
    <line x1="10" y1="230" x2="450" y2="230" stroke="#44300A" stroke-width="0.5"/>
    <!-- Candlesticks -->
    <g>
        <line x1="30" y1="90" x2="30" y2="137" stroke="#10B981" stroke-width="1.5"/>
        <rect x="22" y="91" width="16" height="45" rx="2" fill="#10B981" opacity="0.85"/>
      </g>
    <g>
        <line x1="65" y1="35" x2="65" y2="127" stroke="#EF4444" stroke-width="1.5"/>
        <rect x="57" y="71.5" width="16" height="19" rx="2" fill="#EF4444" opacity="0.85"/>
      </g>
    <g>
        <line x1="100" y1="79" x2="100" y2="142" stroke="#10B981" stroke-width="1.5"/>
        <rect x="92" y="102.5" width="16" height="16" rx="2" fill="#10B981" opacity="0.85"/>
      </g>
    <g>
        <line x1="135" y1="84" x2="135" y2="115" stroke="#10B981" stroke-width="1.5"/>
        <rect x="127" y="89.5" width="16" height="20" rx="2" fill="#10B981" opacity="0.85"/>
      </g>
    <g>
        <line x1="170" y1="107" x2="170" y2="160" stroke="#EF4444" stroke-width="1.5"/>
        <rect x="162" y="117" width="16" height="33" rx="2" fill="#EF4444" opacity="0.85"/>
      </g>
    <g>
        <line x1="205" y1="61" x2="205" y2="130" stroke="#EF4444" stroke-width="1.5"/>
        <rect x="197" y="69.5" width="16" height="52" rx="2" fill="#EF4444" opacity="0.85"/>
      </g>
    <g>
        <line x1="240" y1="124" x2="240" y2="148" stroke="#EF4444" stroke-width="1.5"/>
        <rect x="232" y="119.5" width="16" height="33" rx="2" fill="#EF4444" opacity="0.85"/>
      </g>
    <g>
        <line x1="275" y1="63" x2="275" y2="103" stroke="#10B981" stroke-width="1.5"/>
        <rect x="267" y="72.5" width="16" height="21" rx="2" fill="#10B981" opacity="0.85"/>
      </g>
    <g>
        <line x1="310" y1="56" x2="310" y2="123" stroke="#EF4444" stroke-width="1.5"/>
        <rect x="302" y="63" width="16" height="53" rx="2" fill="#EF4444" opacity="0.85"/>
      </g>
    <g>
        <line x1="345" y1="78" x2="345" y2="99" stroke="#10B981" stroke-width="1.5"/>
        <rect x="337" y="64.5" width="16" height="48" rx="2" fill="#10B981" opacity="0.85"/>
      </g>
    <g>
        <line x1="380" y1="137" x2="380" y2="216" stroke="#EF4444" stroke-width="1.5"/>
        <rect x="372" y="149.5" width="16" height="54" rx="2" fill="#EF4444" opacity="0.85"/>
      </g>
    <g>
        <line x1="415" y1="56" x2="415" y2="168" stroke="#10B981" stroke-width="1.5"/>
        <rect x="407" y="86" width="16" height="52" rx="2" fill="#10B981" opacity="0.85"/>
      </g>
    <!-- ARIMA forecast line -->
    <polyline class="mf_line" points="30,180 65,160 100,170 135,130 170,145 205,120 240,110 275,100 310,115 345,90 380,85 415,70" fill="none" stroke="#F59E0B" stroke-width="2.5" filter="url(#mf_g)"/>
    <!-- Prophet forecast line -->
    <polyline class="mf_line" points="30,185 65,165 100,180 135,140 170,150 205,125 240,118 275,108 310,120 345,95 380,92 415,78" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0.7" style="animation-delay:0.5s"/>
    <!-- XGBoost line -->
    <polyline class="mf_line" points="30,175 65,155 100,165 135,125 170,140 205,115 240,105 275,95 310,110 345,85 380,80 415,65" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.7" style="animation-delay:1s"/>
    <!-- Confidence interval -->
    <polygon points="310,100 345,75 380,70 415,55 415,95 380,100 345,110 310,130" fill="#F59E0B" opacity="0.08"/>
    <text x="10" y="255" font-family="monospace" font-size="9" fill="#64748B">━ ARIMA  ━ Prophet  ━ XGBoost  ░ 95% CI</text>
  </g>
  
  <!-- Model Weights Panel -->
  <g transform="translate(530,50)">
    <text x="0" y="0" font-family="'JetBrains Mono',monospace" font-size="11" fill="#FBBF24" font-weight="700" letter-spacing="2">ENSEMBLE WEIGHTS</text>
    <rect x="0" y="10" width="240" height="130" rx="6" fill="#1A1308" stroke="#92400E" stroke-width="1"/>
    
      <text x="15" y="40" font-family="monospace" font-size="11" fill="#FDE68A">ARIMA(5,1,2)</text>
      <rect x="15" y="48" width="175" height="12" rx="3" fill="#F59E0B" opacity="0.8"/>
      <text x="200" y="58" font-family="monospace" font-size="10" fill="#F59E0B" font-weight="700">35%</text>
    
      <text x="15" y="75" font-family="monospace" font-size="11" fill="#FDE68A">Prophet</text>
      <rect x="15" y="83" width="150" height="12" rx="3" fill="#FBBF24" opacity="0.8"/>
      <text x="175" y="93" font-family="monospace" font-size="10" fill="#FBBF24" font-weight="700">30%</text>
    
      <text x="15" y="110" font-family="monospace" font-size="11" fill="#FDE68A">XGBoost</text>
      <rect x="15" y="118" width="175" height="12" rx="3" fill="#D97706" opacity="0.8"/>
      <text x="200" y="128" font-family="monospace" font-size="10" fill="#D97706" font-weight="700">35%</text>
    
  </g>
  
  <!-- Performance Metrics -->
  <g transform="translate(530,210)">
    <text x="0" y="0" font-family="'JetBrains Mono',monospace" font-size="11" fill="#FDE68A" font-weight="700" letter-spacing="2">PERFORMANCE</text>
    <rect x="0" y="10" width="240" height="90" rx="6" fill="#1A1308" stroke="#92400E" stroke-width="1"/>
    
      <text x="15" y="38" font-family="monospace" font-size="11" fill="#94A3B8">RMSE</text>
      <text x="225" y="38" text-anchor="end" font-family="monospace" font-size="12" fill="#FBBF24" font-weight="700">0.0247</text>
    
      <text x="15" y="63" font-family="monospace" font-size="11" fill="#94A3B8">MAPE</text>
      <text x="225" y="63" text-anchor="end" font-family="monospace" font-size="12" fill="#FBBF24" font-weight="700">3.2%</text>
    
      <text x="15" y="88" font-family="monospace" font-size="11" fill="#94A3B8">Sharpe</text>
      <text x="225" y="88" text-anchor="end" font-family="monospace" font-size="12" fill="#FBBF24" font-weight="700">2.14</text>
    
  </g>
  
  <!-- Bottom Bar -->
  <g transform="translate(40,410)">
    <line x1="0" y1="-8" x2="720" y2="-8" stroke="#92400E" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Market Forecast Ensemble</text>
    <text x="720" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#F59E0B">ARIMA • Prophet • XGBoost • Variance-Weighted</text>
  </g>
</svg>