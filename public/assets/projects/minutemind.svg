<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_minutemind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    
    <radialGradient id="aura_minutemind" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGrad_minutemind" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <pattern id="dotGrid_minutemind" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <filter id="glow_minutemind" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad_minutemind)" />
  <rect width="800" height="450" fill="url(#dotGrid_minutemind)" />
  <rect width="800" height="450" fill="url(#aura_minutemind)" />

  <!-- Outer HUD Frame Border -->
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="url(#accentGrad_minutemind)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner HUD Accents -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 764 12 L 788 12 L 788 36" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 12 414 L 12 438 L 36 438" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 764 438 L 788 438 L 788 414" fill="none" stroke="#00F2FF" stroke-width="2.5" />

  <!-- Top Telemetry Header -->
  <g transform="translate(32, 38)">
    <circle cx="4" cy="4" r="3.5" fill="#00F2FF" filter="url(#glow_minutemind)" />
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F2FF" letter-spacing="1.5">SYS // MINUTEMIND</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(40, 20)">
        <rect x="0" y="0" width="330" height="190" rx="8" fill="#0B132B" stroke="#00F2FF" stroke-width="1.5" />
        <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#00F2FF">DIARIZATION WAVEFORM BUFFERS</text>
        
        <text x="20" y="60" font-family="monospace" font-size="9" fill="#00F2FF">Speaker A (VP Eng)</text>
        <path d="M 20 80 Q 50 60 80 80 T 140 80 T 200 65 T 260 80 T 310 75" fill="none" stroke="#00F2FF" stroke-width="2" />

        <text x="20" y="115" font-family="monospace" font-size="9" fill="#8B5CF6">Speaker B (Tech Lead)</text>
        <path d="M 20 135 Q 60 150 100 135 T 180 135 T 240 120 T 310 135" fill="none" stroke="#8B5CF6" stroke-width="2" />
        <text x="20" y="165" font-family="monospace" font-size="8" fill="#64748B">2+ Hour Call Rolling Windows</text>

        <g transform="translate(360, 0)">
          <rect x="0" y="0" width="360" height="190" rx="8" fill="#0E1626" stroke="#10B981" stroke-width="1.5" />
          <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#10B981">ACTION ITEM CHECKLIST (94.2% RECALL)</text>
          <text x="20" y="60" font-family="monospace" font-size="9" fill="#CBD5E1">☑ Deploy hotfix to prod-us-east [Zaheer • Today]</text>
          <text x="20" y="85" font-family="monospace" font-size="9" fill="#CBD5E1">☑ Benchmark RAG Triad with RRF [Sarah • Friday]</text>
          <text x="20" y="110" font-family="monospace" font-size="9" fill="#CBD5E1">☑ Schedule Q3 architecture review [Team]</text>
          <line x1="20" y1="130" x2="340" y2="130" stroke="#334155" />
          <text x="20" y="155" font-family="monospace" font-size="9" fill="#10B981">Compression: 85% Words Reduced</text>
        </g>
      </g>
    
  </g>

  <!-- Bottom Identity Bar -->
  <g transform="translate(32, 405)">
    <line x1="0" y1="-12" x2="736" y2="-12" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">MinuteMind</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Multi-Speaker Diarization • Action Item Extraction</text>
  </g>
</svg>