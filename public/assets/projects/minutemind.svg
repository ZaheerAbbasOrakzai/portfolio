<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="minutemindsvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0A1A"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <filter id="minutemindsvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes minutemindsvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes minutemindsvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes minutemindsvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .minutemindsvg_line { stroke-dasharray:800; animation: minutemindsvg_draw 4s ease-out forwards; }
      .minutemindsvg_dot { animation: minutemindsvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#minutemindsvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#6366F1" filter="url(#minutemindsvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#6366F1" font-weight="700" letter-spacing="2">MEETING SYNTHESIS</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#3730A3" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#15102D" stroke="#3730A3" stroke-width="1"/>
    <polyline class="minutemindsvg_line" points="20,109 60,58 100,72 140,115 180,64 220,104 260,65 300,95 340,103 380,101 420,52 460,76 500,56 540,103 580,96 620,58 660,101 700,114" fill="none" stroke="#6366F1" stroke-width="2.5" filter="url(#minutemindsvg_g)"/>
    <polyline class="minutemindsvg_line" points="20,81 60,93 100,110 140,55 180,106 220,92 260,64 300,119 340,125 380,88 420,113 460,98 500,80 540,66 580,75 620,113 660,63 700,89" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#3730A3" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#3730A3" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#3730A3" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#3730A3" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#3730A3" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#818CF8" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#15102D" stroke="#6366F1" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#818CF8">Transcript Intelligence</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#15102D" stroke="#6366F1" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#818CF8">Action Items</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#15102D" stroke="#6366F1" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#818CF8">Decision Extraction</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#C7D2FE" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#15102D" stroke="#3730A3" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="minutemindsvg_dot" x="120" y="27" width="113" height="14" rx="3" fill="#6366F1" opacity="0.5" style="animation-delay:0s"/>
      <text x="243" y="38" font-family="monospace" font-size="11" fill="#6366F1" font-weight="700">96%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="minutemindsvg_dot" x="120" y="55" width="414" height="14" rx="3" fill="#6366F1" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="544" y="66" font-family="monospace" font-size="11" fill="#6366F1" font-weight="700">24ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="minutemindsvg_dot" x="120" y="83" width="145" height="14" rx="3" fill="#6366F1" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="275" y="94" font-family="monospace" font-size="11" fill="#6366F1" font-weight="700">671/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#3730A3" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">MinuteMind</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#6366F1">Transcript Intelligence • Action Items • Decision Extraction</text>
  </g>
</svg>