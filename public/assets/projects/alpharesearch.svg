<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="alpharesearchsvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1A05"/>
      <stop offset="100%" stop-color="#081005"/>
    </linearGradient>
    <filter id="alpharesearchsvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes alpharesearchsvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes alpharesearchsvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes alpharesearchsvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .alpharesearchsvg_line { stroke-dasharray:800; animation: alpharesearchsvg_draw 4s ease-out forwards; }
      .alpharesearchsvg_dot { animation: alpharesearchsvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#alpharesearchsvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#65A30D" filter="url(#alpharesearchsvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#65A30D" font-weight="700" letter-spacing="2">EQUITY RESEARCH</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#4D7C0F" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#152D0A" stroke="#4D7C0F" stroke-width="1"/>
    <polyline class="alpharesearchsvg_line" points="20,100 60,92 100,68 140,115 180,95 220,95 260,86 300,121 340,84 380,118 420,51 460,94 500,62 540,110 580,119 620,79 660,65 700,126" fill="none" stroke="#65A30D" stroke-width="2.5" filter="url(#alpharesearchsvg_g)"/>
    <polyline class="alpharesearchsvg_line" points="20,69 60,103 100,108 140,124 180,69 220,133 260,62 300,82 340,98 380,95 420,128 460,132 500,61 540,109 580,110 620,62 660,116 700,130" fill="none" stroke="#A3E635" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#4D7C0F" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#4D7C0F" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#4D7C0F" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#4D7C0F" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#4D7C0F" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#A3E635" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#152D0A" stroke="#65A30D" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#A3E635">Balance Sheets</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#152D0A" stroke="#65A30D" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#A3E635">Earnings Call Q&A</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#152D0A" stroke="#65A30D" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#A3E635">10-K Parsing</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#D9F99D" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#152D0A" stroke="#4D7C0F" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="alpharesearchsvg_dot" x="120" y="27" width="372" height="14" rx="3" fill="#65A30D" opacity="0.5" style="animation-delay:0s"/>
      <text x="502" y="38" font-family="monospace" font-size="11" fill="#65A30D" font-weight="700">93%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="alpharesearchsvg_dot" x="120" y="55" width="241" height="14" rx="3" fill="#65A30D" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="371" y="66" font-family="monospace" font-size="11" fill="#65A30D" font-weight="700">32ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="alpharesearchsvg_dot" x="120" y="83" width="375" height="14" rx="3" fill="#65A30D" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="505" y="94" font-family="monospace" font-size="11" fill="#65A30D" font-weight="700">149/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#4D7C0F" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">AlphaResearch</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#65A30D">Balance Sheets • Earnings Call Q&A • 10-K Parsing</text>
  </g>
</svg>