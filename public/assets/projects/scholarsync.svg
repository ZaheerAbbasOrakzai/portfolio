<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_scholarsync" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    
    <radialGradient id="aura_scholarsync" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGrad_scholarsync" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <pattern id="dotGrid_scholarsync" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <filter id="glow_scholarsync" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad_scholarsync)" />
  <rect width="800" height="450" fill="url(#dotGrid_scholarsync)" />
  <rect width="800" height="450" fill="url(#aura_scholarsync)" />

  <!-- Outer HUD Frame Border -->
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="url(#accentGrad_scholarsync)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner HUD Accents -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 764 12 L 788 12 L 788 36" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 12 414 L 12 438 L 36 438" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 764 438 L 788 438 L 788 414" fill="none" stroke="#00F2FF" stroke-width="2.5" />

  <!-- Top Telemetry Header -->
  <g transform="translate(32, 38)">
    <circle cx="4" cy="4" r="3.5" fill="#00F2FF" filter="url(#glow_scholarsync)" />
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F2FF" letter-spacing="1.5">SYS // SCHOLARSYNC</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(40, 20)">
        <rect x="0" y="20" width="180" height="150" rx="8" fill="#0E1626" stroke="#00F2FF" stroke-width="1.5" />
        <text x="20" y="50" font-family="monospace" font-size="11" font-weight="bold" fill="#00F2FF">PDF HARVESTER</text>
        <text x="20" y="75" font-family="monospace" font-size="9" fill="#CBD5E1">arXiv & PubMed APIs</text>
        <text x="20" y="95" font-family="monospace" font-size="9" fill="#94A3B8">Grobid Structuring</text>
        <text x="20" y="115" font-family="monospace" font-size="9" fill="#94A3B8">Equation Extraction</text>
        <text x="20" y="135" font-family="monospace" font-size="9" fill="#00F2FF">98% Table Fidelity</text>

        <path d="M 180 95 L 260 95" stroke="#00F2FF" stroke-width="2" />

        <rect x="260" y="20" width="200" height="150" rx="8" fill="#0E1626" stroke="#8B5CF6" stroke-width="1.5" />
        <text x="280" y="50" font-family="monospace" font-size="11" font-weight="bold" fill="#8B5CF6">EVIDENCE MATRIX</text>
        <text x="280" y="75" font-family="monospace" font-size="9" fill="#CBD5E1">Cross-Paper Synthesis</text>
        <text x="280" y="95" font-family="monospace" font-size="9" fill="#94A3B8">Contradiction Detector</text>
        <text x="280" y="115" font-family="monospace" font-size="9" fill="#94A3B8">Methodology Mapping</text>
        <text x="280" y="135" font-family="monospace" font-size="9" fill="#8B5CF6">Up to 25 Papers</text>

        <path d="M 460 95 L 530 95" stroke="#8B5CF6" stroke-width="2" />

        <rect x="530" y="20" width="180" height="150" rx="8" fill="#0E1626" stroke="#10B981" stroke-width="1.5" />
        <text x="550" y="50" font-family="monospace" font-size="11" font-weight="bold" fill="#10B981">LATEX COMPILER</text>
        <text x="550" y="75" font-family="monospace" font-size="9" fill="#CBD5E1">BibTeX Formatter</text>
        <text x="550" y="95" font-family="monospace" font-size="9" fill="#94A3B8">DOI Verification</text>
        <text x="550" y="115" font-family="monospace" font-size="9" fill="#94A3B8">Overleaf Sync Hook</text>
        <text x="550" y="135" font-family="monospace" font-size="9" fill="#10B981">Publication Ready</text>
      </g>
    
  </g>

  <!-- Bottom Identity Bar -->
  <g transform="translate(32, 405)">
    <line x1="0" y1="-12" x2="736" y2="-12" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">ScholarSync</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Academic PDF Synthesis • BibTeX & Overleaf Engine</text>
  </g>
</svg>