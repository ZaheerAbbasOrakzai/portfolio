<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="nexusdesksvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0D1A"/>
      <stop offset="100%" stop-color="#05080D"/>
    </linearGradient>
    <filter id="nexusdesksvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes nexusdesksvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes nexusdesksvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes nexusdesksvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .nexusdesksvg_line { stroke-dasharray:800; animation: nexusdesksvg_draw 4s ease-out forwards; }
      .nexusdesksvg_dot { animation: nexusdesksvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#nexusdesksvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#4F46E5" filter="url(#nexusdesksvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#4F46E5" font-weight="700" letter-spacing="2">ENTERPRISE SUPPORT</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#4338CA" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#0D1035" stroke="#4338CA" stroke-width="1"/>
    <polyline class="nexusdesksvg_line" points="20,101 60,121 100,58 140,111 180,78 220,110 260,115 300,71 340,90 380,123 420,101 460,73 500,66 540,109 580,113 620,97 660,57 700,106" fill="none" stroke="#4F46E5" stroke-width="2.5" filter="url(#nexusdesksvg_g)"/>
    <polyline class="nexusdesksvg_line" points="20,71 60,76 100,115 140,132 180,72 220,111 260,100 300,94 340,58 380,62 420,81 460,65 500,104 540,87 580,119 620,82 660,98 700,108" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#4338CA" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#4338CA" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#4338CA" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#4338CA" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#4338CA" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#818CF8" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#0D1035" stroke="#4F46E5" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#818CF8">B2B SaaS Support</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#0D1035" stroke="#4F46E5" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#818CF8">RAG Answers</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#0D1035" stroke="#4F46E5" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#818CF8">Escalation Triage</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#C7D2FE" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#0D1035" stroke="#4338CA" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="nexusdesksvg_dot" x="120" y="27" width="252" height="14" rx="3" fill="#4F46E5" opacity="0.5" style="animation-delay:0s"/>
      <text x="382" y="38" font-family="monospace" font-size="11" fill="#4F46E5" font-weight="700">86%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="nexusdesksvg_dot" x="120" y="55" width="434" height="14" rx="3" fill="#4F46E5" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="564" y="66" font-family="monospace" font-size="11" fill="#4F46E5" font-weight="700">50ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="nexusdesksvg_dot" x="120" y="83" width="405" height="14" rx="3" fill="#4F46E5" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="535" y="94" font-family="monospace" font-size="11" fill="#4F46E5" font-weight="700">311/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#4338CA" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">NexusDesk</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#4F46E5">B2B SaaS Support • RAG Answers • Escalation Triage</text>
  </g>
</svg>