<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="wayfareaisvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1A15"/>
      <stop offset="100%" stop-color="#05100D"/>
    </linearGradient>
    <filter id="wayfareaisvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes wayfareaisvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes wayfareaisvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes wayfareaisvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .wayfareaisvg_line { stroke-dasharray:800; animation: wayfareaisvg_draw 4s ease-out forwards; }
      .wayfareaisvg_dot { animation: wayfareaisvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#wayfareaisvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#059669" filter="url(#wayfareaisvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#059669" font-weight="700" letter-spacing="2">ITINERARY AGENT</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#047857" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#052D20" stroke="#047857" stroke-width="1"/>
    <polyline class="wayfareaisvg_line" points="20,77 60,96 100,55 140,108 180,72 220,129 260,74 300,80 340,86 380,84 420,119 460,58 500,70 540,89 580,51 620,95 660,73 700,85" fill="none" stroke="#059669" stroke-width="2.5" filter="url(#wayfareaisvg_g)"/>
    <polyline class="wayfareaisvg_line" points="20,131 60,94 100,104 140,111 180,132 220,77 260,72 300,89 340,59 380,100 420,109 460,100 500,100 540,122 580,74 620,123 660,94 700,127" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#047857" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#047857" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#047857" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#047857" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#047857" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#34D399" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#052D20" stroke="#059669" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#34D399">Constraint-Satisfaction</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#052D20" stroke="#059669" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#34D399">Transit Budget</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#052D20" stroke="#059669" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#34D399">Cultural Prefs</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#6EE7B7" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#052D20" stroke="#047857" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="wayfareaisvg_dot" x="120" y="27" width="102" height="14" rx="3" fill="#059669" opacity="0.5" style="animation-delay:0s"/>
      <text x="232" y="38" font-family="monospace" font-size="11" fill="#059669" font-weight="700">95%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="wayfareaisvg_dot" x="120" y="55" width="393" height="14" rx="3" fill="#059669" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="523" y="66" font-family="monospace" font-size="11" fill="#059669" font-weight="700">9ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="wayfareaisvg_dot" x="120" y="83" width="401" height="14" rx="3" fill="#059669" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="531" y="94" font-family="monospace" font-size="11" fill="#059669" font-weight="700">894/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#047857" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">WayfareAI</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#059669">Constraint-Satisfaction • Transit Budget • Cultural Prefs</text>
  </g>
</svg>