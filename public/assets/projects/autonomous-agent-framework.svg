<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_autonomous-agent-framework" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    
    <radialGradient id="aura_autonomous-agent-framework" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGrad_autonomous-agent-framework" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <pattern id="dotGrid_autonomous-agent-framework" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <filter id="glow_autonomous-agent-framework" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad_autonomous-agent-framework)" />
  <rect width="800" height="450" fill="url(#dotGrid_autonomous-agent-framework)" />
  <rect width="800" height="450" fill="url(#aura_autonomous-agent-framework)" />

  <!-- Outer HUD Frame Border -->
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="url(#accentGrad_autonomous-agent-framework)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner HUD Accents -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#8B5CF6" stroke-width="2.5" />
  <path d="M 764 12 L 788 12 L 788 36" fill="none" stroke="#8B5CF6" stroke-width="2.5" />
  <path d="M 12 414 L 12 438 L 36 438" fill="none" stroke="#8B5CF6" stroke-width="2.5" />
  <path d="M 764 438 L 788 438 L 788 414" fill="none" stroke="#8B5CF6" stroke-width="2.5" />

  <!-- Top Telemetry Header -->
  <g transform="translate(32, 38)">
    <circle cx="4" cy="4" r="3.5" fill="#8B5CF6" filter="url(#glow_autonomous-agent-framework)" />
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8B5CF6" letter-spacing="1.5">SYS // AUTONOMOUS-AGENT-FRAMEWORK</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(40, 20)">
        <rect x="0" y="0" width="340" height="190" rx="8" fill="#0B132B" stroke="#8B5CF6" stroke-width="1.5" />
        <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#8B5CF6">FINITE STATE MACHINE (FSM)</text>
        
        <circle cx="60" cy="80" r="20" fill="#0E1626" stroke="#00F2FF" />
        <text x="60" y="83" text-anchor="middle" font-family="monospace" font-size="7" fill="#F8FAFC">PLAN</text>

        <circle cx="170" cy="80" r="20" fill="#0E1626" stroke="#8B5CF6" />
        <text x="170" y="83" text-anchor="middle" font-family="monospace" font-size="7" fill="#F8FAFC">TOOL</text>

        <circle cx="280" cy="80" r="20" fill="#0E1626" stroke="#10B981" />
        <text x="280" y="83" text-anchor="middle" font-family="monospace" font-size="7" fill="#F8FAFC">VERIFY</text>

        <line x1="80" y1="80" x2="150" y2="80" stroke="#00F2FF" stroke-width="2" />
        <line x1="190" y1="80" x2="260" y2="80" stroke="#8B5CF6" stroke-width="2" />
        <path d="M 280 100 Q 170 140 60 100" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,3" />
        <text x="170" y="150" text-anchor="middle" font-family="monospace" font-size="8" fill="#EF4444">Loop Prevention &amp; Step Budget Enforcement</text>

        <g transform="translate(370, 0)">
          <rect x="0" y="0" width="350" height="190" rx="8" fill="#0E1626" stroke="#10B981" stroke-width="1.5" />
          <text x="20" y="30" font-family="monospace" font-size="11" font-weight="bold" fill="#10B981">EPISODIC &amp; SEMANTIC MEMORY</text>
          <text x="20" y="60" font-family="monospace" font-size="9" fill="#CBD5E1">Top-K Vector Context Retrieval</text>
          <text x="20" y="85" font-family="monospace" font-size="9" fill="#CBD5E1">Tool Dispatch Overhead: &lt;10ms</text>
          <text x="20" y="110" font-family="monospace" font-size="9" fill="#CBD5E1">JSON-Schema Input Type Validation</text>
          <text x="20" y="135" font-family="monospace" font-size="9" fill="#CBD5E1">Self-Correction Feedback Loop</text>
        </g>
      </g>
    
  </g>

  <!-- Bottom Identity Bar -->
  <g transform="translate(32, 405)">
    <line x1="0" y1="-12" x2="736" y2="-12" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">Autonomous Agent Framework</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">FSM Loop Prevention • ChromaDB Episodic Memory</text>
  </g>
</svg>