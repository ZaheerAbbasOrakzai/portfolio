<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="autonomousagentframeworksvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1A0D"/>
      <stop offset="100%" stop-color="#051005"/>
    </linearGradient>
    <filter id="autonomousagentframeworksvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes autonomousagentframeworksvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes autonomousagentframeworksvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes autonomousagentframeworksvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .autonomousagentframeworksvg_line { stroke-dasharray:800; animation: autonomousagentframeworksvg_draw 4s ease-out forwards; }
      .autonomousagentframeworksvg_dot { animation: autonomousagentframeworksvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#autonomousagentframeworksvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#16A34A" filter="url(#autonomousagentframeworksvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#16A34A" font-weight="700" letter-spacing="2">AGENTIC RUNTIME</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#15803D" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#0A2D10" stroke="#15803D" stroke-width="1"/>
    <polyline class="autonomousagentframeworksvg_line" points="20,65 60,85 100,129 140,113 180,98 220,94 260,112 300,76 340,83 380,102 420,97 460,77 500,88 540,92 580,113 620,118 660,57 700,59" fill="none" stroke="#16A34A" stroke-width="2.5" filter="url(#autonomousagentframeworksvg_g)"/>
    <polyline class="autonomousagentframeworksvg_line" points="20,78 60,99 100,110 140,113 180,107 220,81 260,128 300,75 340,74 380,87 420,70 460,94 500,63 540,66 580,125 620,85 660,106 700,126" fill="none" stroke="#4ADE80" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#15803D" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#15803D" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#15803D" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#15803D" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#15803D" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#4ADE80" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#0A2D10" stroke="#16A34A" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#4ADE80">Goal Decomposition</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#0A2D10" stroke="#16A34A" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#4ADE80">Memory Loops</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#0A2D10" stroke="#16A34A" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#4ADE80">Tool Sandbox</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#86EFAC" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#0A2D10" stroke="#15803D" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="autonomousagentframeworksvg_dot" x="120" y="27" width="241" height="14" rx="3" fill="#16A34A" opacity="0.5" style="animation-delay:0s"/>
      <text x="371" y="38" font-family="monospace" font-size="11" fill="#16A34A" font-weight="700">86%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="autonomousagentframeworksvg_dot" x="120" y="55" width="143" height="14" rx="3" fill="#16A34A" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="273" y="66" font-family="monospace" font-size="11" fill="#16A34A" font-weight="700">27ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="autonomousagentframeworksvg_dot" x="120" y="83" width="130" height="14" rx="3" fill="#16A34A" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="260" y="94" font-family="monospace" font-size="11" fill="#16A34A" font-weight="700">399/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#15803D" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Autonomous Agent Framework</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#16A34A">Goal Decomposition • Memory Loops • Tool Sandbox</text>
  </g>
</svg>