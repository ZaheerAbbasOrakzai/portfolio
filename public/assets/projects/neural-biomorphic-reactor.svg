<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="neuralbiomorphicreactorsvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A050D"/>
      <stop offset="100%" stop-color="#0D0508"/>
    </linearGradient>
    <filter id="neuralbiomorphicreactorsvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes neuralbiomorphicreactorsvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes neuralbiomorphicreactorsvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes neuralbiomorphicreactorsvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .neuralbiomorphicreactorsvg_line { stroke-dasharray:800; animation: neuralbiomorphicreactorsvg_draw 4s ease-out forwards; }
      .neuralbiomorphicreactorsvg_dot { animation: neuralbiomorphicreactorsvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#neuralbiomorphicreactorsvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#E11D48" filter="url(#neuralbiomorphicreactorsvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#E11D48" font-weight="700" letter-spacing="2">EXPERIMENTAL AI</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#BE123C" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#2D0A15" stroke="#BE123C" stroke-width="1"/>
    <polyline class="neuralbiomorphicreactorsvg_line" points="20,122 60,53 100,129 140,72 180,72 220,64 260,75 300,128 340,128 380,79 420,68 460,128 500,105 540,50 580,64 620,77 660,90 700,117" fill="none" stroke="#E11D48" stroke-width="2.5" filter="url(#neuralbiomorphicreactorsvg_g)"/>
    <polyline class="neuralbiomorphicreactorsvg_line" points="20,72 60,58 100,85 140,88 180,81 220,120 260,99 300,63 340,121 380,76 420,116 460,60 500,134 540,118 580,62 620,97 660,122 700,71" fill="none" stroke="#FB7185" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#BE123C" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#BE123C" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#BE123C" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#BE123C" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#BE123C" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#FB7185" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#2D0A15" stroke="#E11D48" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#FB7185">Emergent Behavior</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#2D0A15" stroke="#E11D48" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#FB7185">Reactive Dynamics</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#2D0A15" stroke="#E11D48" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#FB7185">Simulation</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#FECDD3" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#2D0A15" stroke="#BE123C" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="neuralbiomorphicreactorsvg_dot" x="120" y="27" width="369" height="14" rx="3" fill="#E11D48" opacity="0.5" style="animation-delay:0s"/>
      <text x="499" y="38" font-family="monospace" font-size="11" fill="#E11D48" font-weight="700">92%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="neuralbiomorphicreactorsvg_dot" x="120" y="55" width="458" height="14" rx="3" fill="#E11D48" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="588" y="66" font-family="monospace" font-size="11" fill="#E11D48" font-weight="700">37ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="neuralbiomorphicreactorsvg_dot" x="120" y="83" width="403" height="14" rx="3" fill="#E11D48" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="533" y="94" font-family="monospace" font-size="11" fill="#E11D48" font-weight="700">223/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#BE123C" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Neural Biomorphic Reactor</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#E11D48">Emergent Behavior • Reactive Dynamics • Simulation</text>
  </g>
</svg>