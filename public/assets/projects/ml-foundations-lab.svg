<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="mlfoundationslabsvg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A1A"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <filter id="mlfoundationslabsvg_g"><feGaussianBlur stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes mlfoundationslabsvg_draw { 0%{stroke-dashoffset:800} 100%{stroke-dashoffset:0} }
      @keyframes mlfoundationslabsvg_pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      @keyframes mlfoundationslabsvg_bar { 0%{width:0} 50%{width:100%} 100%{width:100%} }
      .mlfoundationslabsvg_line { stroke-dasharray:800; animation: mlfoundationslabsvg_draw 4s ease-out forwards; }
      .mlfoundationslabsvg_dot { animation: mlfoundationslabsvg_pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#mlfoundationslabsvg_bg)"/>
  
  <!-- Header -->
  <g transform="translate(30,30)">
    <circle cx="6" cy="6" r="5" fill="#6366F1" filter="url(#mlfoundationslabsvg_g)"/>
    <text x="20" y="10" font-family="'JetBrains Mono',monospace" font-size="11" fill="#6366F1" font-weight="700" letter-spacing="2">MATHEMATICAL FOUNDATIONS</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#4F46E5" stroke-width="1"/>
  </g>
  
  <!-- Signal Chart -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="470" height="160" rx="8" fill="#10102D" stroke="#4F46E5" stroke-width="1"/>
    <polyline class="mlfoundationslabsvg_line" points="20,80 60,111 100,92 140,125 180,72 220,65 260,101 300,63 340,64 380,122 420,75 460,88 500,52 540,94 580,107 620,91 660,63 700,82" fill="none" stroke="#6366F1" stroke-width="2.5" filter="url(#mlfoundationslabsvg_g)"/>
    <polyline class="mlfoundationslabsvg_line" points="20,99 60,122 100,70 140,67 180,81 220,80 260,55 300,101 340,77 380,106 420,101 460,113 500,85 540,115 580,107 620,78 660,134 700,83" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.5" style="animation-delay:0.5s"/>
    <line x1="0" y1="15" x2="470" y2="15" stroke="#4F46E5" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="470" y2="50" stroke="#4F46E5" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="85" x2="470" y2="85" stroke="#4F46E5" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="120" x2="470" y2="120" stroke="#4F46E5" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="155" x2="470" y2="155" stroke="#4F46E5" stroke-width="0.5" opacity="0.3"/>
    <text x="10" y="155" font-family="monospace" font-size="9" fill="#64748B">Real-time telemetry — 500ms sampling interval</text>
  </g>
  
  <!-- Architecture Blocks -->
  <g transform="translate(530,60)">
    <text x="0" y="-5" font-family="monospace" font-size="10" fill="#818CF8" font-weight="700">ARCHITECTURE</text>
    
      <rect x="0" y="5" width="240" height="40" rx="6" fill="#10102D" stroke="#6366F1" stroke-width="1" opacity="0.8"/>
      <text x="120" y="30" text-anchor="middle" font-family="monospace" font-size="10" fill="#818CF8">Calculus</text>
    
      <rect x="0" y="55" width="240" height="40" rx="6" fill="#10102D" stroke="#6366F1" stroke-width="1" opacity="0.8"/>
      <text x="120" y="80" text-anchor="middle" font-family="monospace" font-size="10" fill="#818CF8">Linear Algebra</text>
    
      <rect x="0" y="105" width="240" height="40" rx="6" fill="#10102D" stroke="#6366F1" stroke-width="1" opacity="0.8"/>
      <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#818CF8">Probability</text>
    
      <rect x="0" y="155" width="240" height="40" rx="6" fill="#10102D" stroke="#6366F1" stroke-width="1" opacity="0.8"/>
      <text x="120" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#818CF8">Notebooks</text>
    
  </g>
  
  <!-- Metrics Panel -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#C7D2FE" font-weight="700" letter-spacing="2">PERFORMANCE METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#10102D" stroke="#4F46E5" stroke-width="1"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Accuracy</text>
      <rect class="mlfoundationslabsvg_dot" x="120" y="27" width="351" height="14" rx="3" fill="#6366F1" opacity="0.5" style="animation-delay:0s"/>
      <text x="481" y="38" font-family="monospace" font-size="11" fill="#6366F1" font-weight="700">90%</text>
      <text x="20" y="66" font-family="monospace" font-size="10" fill="#94A3B8">Latency</text>
      <rect class="mlfoundationslabsvg_dot" x="120" y="55" width="479" height="14" rx="3" fill="#6366F1" opacity="0.5" style="animation-delay:0.3s"/>
      <text x="609" y="66" font-family="monospace" font-size="11" fill="#6366F1" font-weight="700">45ms</text>
      <text x="20" y="94" font-family="monospace" font-size="10" fill="#94A3B8">Throughput</text>
      <rect class="mlfoundationslabsvg_dot" x="120" y="83" width="376" height="14" rx="3" fill="#6366F1" opacity="0.5" style="animation-delay:0.6s"/>
      <text x="506" y="94" font-family="monospace" font-size="11" fill="#6366F1" font-weight="700">660/s</text>
  </g>
  
  <!-- Bottom Title -->
  <g transform="translate(30,410)">
    <line x1="0" y1="-8" x2="740" y2="-8" stroke="#4F46E5" stroke-width="1"/>
    <text x="0" y="12" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">ML Foundations Lab</text>
    <text x="740" y="12" text-anchor="end" font-family="monospace" font-size="11" fill="#6366F1">Calculus • Linear Algebra • Probability • Notebooks</text>
  </g>
</svg>