<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_Hybrid-RAG-Eval" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    
    <radialGradient id="aura_Hybrid-RAG-Eval" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentGrad_Hybrid-RAG-Eval" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <pattern id="dotGrid_Hybrid-RAG-Eval" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <filter id="glow_Hybrid-RAG-Eval" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad_Hybrid-RAG-Eval)" />
  <rect width="800" height="450" fill="url(#dotGrid_Hybrid-RAG-Eval)" />
  <rect width="800" height="450" fill="url(#aura_Hybrid-RAG-Eval)" />

  <!-- Outer HUD Frame Border -->
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="12" y="12" width="776" height="426" rx="14" fill="none" stroke="url(#accentGrad_Hybrid-RAG-Eval)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner HUD Accents -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 764 12 L 788 12 L 788 36" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 12 414 L 12 438 L 36 438" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 764 438 L 788 438 L 788 414" fill="none" stroke="#00F2FF" stroke-width="2.5" />

  <!-- Top Telemetry Header -->
  <g transform="translate(32, 38)">
    <circle cx="4" cy="4" r="3.5" fill="#00F2FF" filter="url(#glow_Hybrid-RAG-Eval)" />
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F2FF" letter-spacing="1.5">SYS // HYBRID-RAG-EVAL</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE // VERIFIED</text>
    <line x1="0" y1="18" x2="736" y2="18" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Domain-Specific Interactive Visual Metaphor -->
  <g transform="translate(40, 75)">
    
      <g transform="translate(40, 20)">
        <rect x="0" y="10" width="190" height="85" rx="8" fill="#0E1626" stroke="#00F2FF" stroke-width="1.5" />
        <text x="15" y="35" font-family="monospace" font-size="11" font-weight="bold" fill="#00F2FF">BM25 LEXICAL ENGINE</text>
        <text x="15" y="55" font-family="monospace" font-size="9" fill="#94A3B8">Inverted Index Tokenizer</text>
        <text x="15" y="72" font-family="monospace" font-size="9" fill="#64748B">Exact Keyword Match</text>

        <rect x="0" y="125" width="190" height="85" rx="8" fill="#0E1626" stroke="#8B5CF6" stroke-width="1.5" />
        <text x="15" y="150" font-family="monospace" font-size="11" font-weight="bold" fill="#8B5CF6">DENSE VECTOR RETRIEVER</text>
        <text x="15" y="170" font-family="monospace" font-size="9" fill="#94A3B8">FAISS HNSW Embeddings</text>
        <text x="15" y="187" font-family="monospace" font-size="9" fill="#64748B">Cosine Semantic Match</text>

        <rect x="270" y="70" width="180" height="85" rx="10" fill="#1E1B4B" stroke="#00F2FF" stroke-width="2" />
        <text x="285" y="100" font-family="monospace" font-size="11" font-weight="bold" fill="#F8FAFC">RRF FUSION LAYER</text>
        <text x="285" y="120" font-family="monospace" font-size="9" fill="#00F2FF">Score = SUM(1/(k+r))</text>
        <text x="285" y="137" font-family="monospace" font-size="9" fill="#A78BFA">k=60 Constant</text>

        <rect x="520" y="70" width="180" height="85" rx="8" fill="#06281E" stroke="#10B981" stroke-width="1.5" />
        <text x="535" y="100" font-family="monospace" font-size="11" font-weight="bold" fill="#10B981">RAG TRIAD EVAL</text>
        <text x="535" y="120" font-family="monospace" font-size="9" fill="#CBD5E1">Context Relevancy</text>
        <text x="535" y="137" font-family="monospace" font-size="9" fill="#CBD5E1">Grounded Faithfulness</text>

        <path d="M 190 52 L 270 95" stroke="#00F2FF" stroke-width="2" />
        <path d="M 190 168 L 270 128" stroke="#8B5CF6" stroke-width="2" />
        <path d="M 450 112 L 520 112" stroke="#10B981" stroke-width="2.5" />
      </g>
    
  </g>

  <!-- Bottom Identity Bar -->
  <g transform="translate(32, 405)">
    <line x1="0" y1="-12" x2="736" y2="-12" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">Hybrid RAG Eval</text>
    <text x="736" y="8" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">BM25 Sparse + Dense FAISS • Reciprocal Rank Fusion</text>
