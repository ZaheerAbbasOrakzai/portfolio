<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="hr_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#021A1A"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <filter id="hr_g"><feGaussianBlur stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <style>
      @keyframes hr_flow { 0%{stroke-dashoffset:40} 100%{stroke-dashoffset:0} }
      @keyframes hr_pop { 0%,100%{r:5} 50%{r:8} }
      @keyframes hr_bar { 0%{width:0} 100%{width:var(--tw)} }
      .hr_pipe { stroke-dasharray:10 8; animation: hr_flow 1.5s linear infinite; }
      .hr_node { animation: hr_pop 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#hr_bg)"/>
  
  <!-- Query Box -->
  <g transform="translate(30,100)">
    <rect width="140" height="60" rx="10" fill="#0D3B3B" stroke="#14B8A6" stroke-width="2"/>
    <text x="70" y="28" text-anchor="middle" font-family="'Inter',sans-serif" font-size="13" font-weight="800" fill="#5EEAD4">QUERY</text>
    <text x="70" y="45" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748B">User Question</text>
  </g>
  
  <!-- Flow Lines to 3 Retrievers -->
  <line class="hr_pipe" x1="170" y1="130" x2="240" y2="60" stroke="#14B8A6" stroke-width="2"/>
  <line class="hr_pipe" x1="170" y1="130" x2="240" y2="130" stroke="#06B6D4" stroke-width="2"/>
  <line class="hr_pipe" x1="170" y1="130" x2="240" y2="200" stroke="#0EA5E9" stroke-width="2"/>
  
  <!-- BM25 Sparse -->
  <g transform="translate(240,30)">
    <rect width="150" height="60" rx="10" fill="#0C2D2D" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="75" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#14B8A6">BM25 SPARSE</text>
    <text x="75" y="45" text-anchor="middle" font-family="monospace" font-size="9" fill="#5EEAD4">TF-IDF Inverted Index</text>
  </g>
  <!-- Dense Vector -->
  <g transform="translate(240,100)">
    <rect width="150" height="60" rx="10" fill="#0C1D3D" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="75" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#06B6D4">DENSE VECTOR</text>
    <text x="75" y="45" text-anchor="middle" font-family="monospace" font-size="9" fill="#67E8F9">FAISS + BGE-M3</text>
  </g>
  <!-- Cross-Encoder -->
  <g transform="translate(240,170)">
    <rect width="150" height="60" rx="10" fill="#0C1035" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="75" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0EA5E9">RERANKER</text>
    <text x="75" y="45" text-anchor="middle" font-family="monospace" font-size="9" fill="#7DD3FC">Cross-Encoder v3</text>
  </g>
  
  <!-- RRF Fusion -->
  <line class="hr_pipe" x1="390" y1="60" x2="460" y2="130" stroke="#14B8A6" stroke-width="2" style="animation-delay:0.5s"/>
  <line class="hr_pipe" x1="390" y1="130" x2="460" y2="130" stroke="#06B6D4" stroke-width="2" style="animation-delay:0.5s"/>
  <line class="hr_pipe" x1="390" y1="200" x2="460" y2="130" stroke="#0EA5E9" stroke-width="2" style="animation-delay:0.5s"/>
  
  <g transform="translate(460,95)">
    <rect width="120" height="70" rx="12" fill="#14B8A6" fill-opacity="0.15" stroke="#14B8A6" stroke-width="2"/>
    <text x="60" y="30" text-anchor="middle" font-family="'Inter',sans-serif" font-size="14" font-weight="800" fill="#5EEAD4">RRF</text>
    <text x="60" y="50" text-anchor="middle" font-family="monospace" font-size="9" fill="#99F6E4">Reciprocal Rank</text>
    <text x="60" y="62" text-anchor="middle" font-family="monospace" font-size="9" fill="#99F6E4">Fusion k=60</text>
  </g>
  
  <!-- Arrow to LLM -->
  <line class="hr_pipe" x1="580" y1="130" x2="640" y2="130" stroke="#5EEAD4" stroke-width="2.5" style="animation-delay:1s"/>
  <g transform="translate(640,95)">
    <rect width="130" height="70" rx="12" fill="#0D3B3B" stroke="#5EEAD4" stroke-width="2"/>
    <text x="65" y="30" text-anchor="middle" font-family="'Inter',sans-serif" font-size="14" font-weight="800" fill="#F0FDFA">LLM GEN</text>
    <text x="65" y="50" text-anchor="middle" font-family="monospace" font-size="9" fill="#5EEAD4">Context-Grounded</text>
    <text x="65" y="62" text-anchor="middle" font-family="monospace" font-size="9" fill="#5EEAD4">Answer Synthesis</text>
  </g>
  
  <!-- RAG Triad Metrics Panel -->
  <g transform="translate(30,270)">
    <text x="0" y="0" font-family="'JetBrains Mono',monospace" font-size="11" fill="#5EEAD4" font-weight="700" letter-spacing="2">RAG TRIAD EVALUATION METRICS</text>
    <rect x="0" y="10" width="740" height="100" rx="8" fill="#0A1E1E" stroke="#14B8A6" stroke-width="1" opacity="0.8"/>
    
      <text x="20" y="38" font-family="monospace" font-size="10" fill="#94A3B8">Context Relevancy</text>
      <rect x="200" y="27" width="414" height="14" rx="3" fill="#14B8A6" opacity="0.7"/>
      <text x="624" y="38" font-family="monospace" font-size="10" fill="#14B8A6" font-weight="700">92%</text>
    
      <text x="20" y="60" font-family="monospace" font-size="10" fill="#94A3B8">Answer Faithfulness</text>
      <rect x="200" y="49" width="396" height="14" rx="3" fill="#06B6D4" opacity="0.7"/>
      <text x="606" y="60" font-family="monospace" font-size="10" fill="#06B6D4" font-weight="700">88%</text>
    
      <text x="20" y="82" font-family="monospace" font-size="10" fill="#94A3B8">Answer Relevancy</text>
      <rect x="200" y="71" width="427.5" height="14" rx="3" fill="#5EEAD4" opacity="0.7"/>
      <text x="637.5" y="82" font-family="monospace" font-size="10" fill="#5EEAD4" font-weight="700">95%</text>
    
      <text x="20" y="104" font-family="monospace" font-size="10" fill="#94A3B8">Hallucination Rate</text>
      <rect x="200" y="93" width="18" height="14" rx="3" fill="#EF4444" opacity="0.7"/>
      <text x="228" y="104" font-family="monospace" font-size="10" fill="#EF4444" font-weight="700">4%</text>
    
  </g>
  
  <!-- Title -->
  <g transform="translate(30,410)">
    <text x="0" y="10" font-family="'Inter',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Hybrid RAG Eval</text>
    <text x="740" y="10" text-anchor="end" font-family="monospace" font-size="11" fill="#14B8A6">BM25 + Dense + Reranker • RRF Fusion • Triad Metrics</text>
  </g>
</svg>